# Validate, test, build and deploy the roadmap app to GitHub Pages.
# Pushes to main deploy; pull requests only run the checks. Approved at Gate 5 prep (23 Nov 2026).
# Action versions checked on 23 Nov 2026; Dependabot (.github/dependabot.yml) proposes updates.
name: Validate, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Validate data and privacy lint (record IDs, status text in ev, core rule, timetable is ciphertext)
        run: python tools/validate.py
      - name: ROADMAP.md tables match data
        run: python tools/docgen.py --check
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Build
        run: python tools/build.py
      - name: Browser smoke test
        run: python tests/e2e_smoke.py
      - name: Persistence tests (progress survives data updates)
        run: python tests/e2e_persistence.py
      - name: UI tests (keyboard, search, mobile, timetable)
        run: python tests/e2e_ui.py
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
