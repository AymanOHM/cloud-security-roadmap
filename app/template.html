<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: Wayfind (deal 3/3, seed personal-offline-study-tracker-d229·00843a43·2026-11-28·r0) · redesign: full
 * nav: a top bar with three destinations (Today, Roadmap, Plan) that moves to a bottom bar on the phone · signature: the Route lens, one competency drawn as a station on its line, what it needs behind and what it unlocks ahead · states: empty, locked, ready, in progress, completed, late, no evidence, storage blocked, wrong password, nothing matches · wayfind: platform (light), night (dark), the departure board stays ink in both
 * axes: light/mono/cool · posture: committed · contrast: pass · fonts: Chivo Mono embedded · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S5 R4 V4 · weakest: H, a 107-row roadmap is dense by nature; each screen answers one question and the rest sits one tap away */
/* Hallmark · waive 3 · .ptrail::before, .rcol and .today sit on no card: each is a free-standing rule with stations or bars hung on it · the line is the metro line itself (the project stations, the phone route, the cert timeline's today mark), not a stripe on a container */
/* Hallmark · dismissed 41 · every flagged surface is a paper token and inherits --color-ink, and both swap together in the night colourway; the ink plates set their own text */
/* Hallmark · dismissed 70 · the flagged string is barHTML drawing a progress bar from saved statuses, not a success message */
/* Hallmark · answered F4 · one cobalt primary per screen; the chosen nav cell, lens cell and pressed toggles fill ink as selection state, the way a choice set does in Wayfind; "List" and "Board" are lens cells, not a hero */
/* Hallmark · answered F7 · every text field shares one recipe on purpose so search, filters, evidence and session fields read as one control */
/* Hallmark · dismissed F21 · the order is template order across views; in each rendered view an h1 leads h2 sections and h3 sits under h2 (the drawer opens at h2) */
/* Hallmark · dropped tabs, tab-flow, tab-roadmap, tab-kanban, tab-checklist, tab-paths, tab-compare, tab-projects, tab-certs, tab-time, tab-dash, v-dash, cv-roadmap, fst, fblk, kq, kst, kpa · the ten tabs became three destinations and four lenses; the dashboard split into Today, Plan › Skills and Data (#exp #imp #rst kept there); the stage map folded into the List's stage headers and the Route lens; one filter bar (fq, fstage, fpath, fstatus, fsrc) replaces the per-view ones */

@font-face{font-family:"Chivo Mono";src:url("data:font/woff2;base64,__FONT_CHIVO_MONO__") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}

/* ---------- tokens: Wayfind platform (light) by default, night (dark) by mode or OS ---------- */
:root{
  color-scheme:light dark;
  --space-3xs:2px;--space-2xs:4px;--space-xs:8px;--space-sm:12px;--space-md:16px;--space-lg:24px;--space-xl:40px;--space-2xl:64px;--space-3xl:96px;
  --text-xs:0.75rem;--text-sm:0.875rem;--text-md:1rem;--text-lg:1.125rem;--text-xl:1.35rem;--text-2xl:1.62rem;--text-3xl:2.1rem;--text-fig:2.6rem;
  --ease-out:cubic-bezier(0.16,1,0.3,1);--dur-micro:120ms;--dur-short:220ms;
  --container:1360px;--gutter:32px;--panel-w:520px;--ctl-h:40px;--hdr-h:64px;--nav-h:0px;
  --z-raised:10;--z-sticky:200;--z-nav:300;--z-panel:350;--z-modal:400;
  --font-display:"Chivo Mono",ui-monospace,"SF Mono",Menlo,monospace;--font-body:var(--font-display);
  --radius-card:0;--radius-pill:999px;--rule-hair:1px;--rule-bar:2px;
  --tracking-display:-0.03em;--display-weight:800;

  --color-paper:oklch(95.5% 0.006 250);--color-paper-2:oklch(91% 0.009 250);--color-paper-3:oklch(99.5% 0.005 250);
  --color-ink:oklch(16% 0.014 262);--color-ink-2:oklch(29% 0.014 262);--color-muted:oklch(47% 0.016 260);
  --color-rule:oklch(80% 0.011 250);--color-ink-rule:oklch(34% 0.014 262);
  --color-accent:oklch(51% 0.22 264);--color-accent-2:oklch(81% 0.16 82);--color-accent-ink:oklch(99.5% 0.003 250);--color-focus:oklch(51% 0.22 264);
  --color-accent-soft:oklch(90% 0.05 264);--color-amber-soft:oklch(90% 0.09 85);
  --color-error:oklch(50% 0.19 27);--color-scrim:oklch(16% 0.014 262 / 0.5);
  /* the departure board: ink in both modes */
  --color-plate:oklch(16% 0.014 262);--color-plate-ink:oklch(96% 0.005 250);--color-plate-muted:oklch(74% 0.014 255);--color-plate-rule:oklch(31% 0.014 262);
  /* the network's own line colours, shown only as small squares beside a lane's name */
  --line-net:oklch(62% 0.16 150);--line-lnx:oklch(74% 0.15 80);--line-code:oklch(58% 0.2 27);--line-ctr:oklch(62% 0.12 215);
  --line-cloud:oklch(54% 0.2 295);--line-sec:oklch(56% 0.2 345);--line-csec:oklch(48% 0.1 195);--line-career:oklch(60% 0.03 260);
}
:root[data-mode="dark"]{
  --color-paper:oklch(15% 0.012 262);--color-paper-2:oklch(19.5% 0.013 262);--color-paper-3:oklch(22% 0.013 262);
  --color-ink:oklch(96% 0.005 250);--color-ink-2:oklch(85% 0.008 250);--color-muted:oklch(73% 0.016 255);
  --color-rule:oklch(31% 0.014 262);--color-ink-rule:oklch(42% 0.014 262);
  --color-accent:oklch(72% 0.15 264);--color-accent-ink:oklch(15% 0.03 264);--color-focus:oklch(72% 0.15 264);
  --color-accent-soft:oklch(30% 0.08 264);--color-amber-soft:oklch(34% 0.07 80);--color-error:oklch(72% 0.16 27);--color-scrim:oklch(8% 0.01 262 / 0.65);
  --color-plate:oklch(11% 0.012 262);--color-plate-rule:oklch(30% 0.014 262);
}
@media (prefers-color-scheme:dark){:root:not([data-mode]){
  --color-paper:oklch(15% 0.012 262);--color-paper-2:oklch(19.5% 0.013 262);--color-paper-3:oklch(22% 0.013 262);
  --color-ink:oklch(96% 0.005 250);--color-ink-2:oklch(85% 0.008 250);--color-muted:oklch(73% 0.016 255);
  --color-rule:oklch(31% 0.014 262);--color-ink-rule:oklch(42% 0.014 262);
  --color-accent:oklch(72% 0.15 264);--color-accent-ink:oklch(15% 0.03 264);--color-focus:oklch(72% 0.15 264);
  --color-accent-soft:oklch(30% 0.08 264);--color-amber-soft:oklch(34% 0.07 80);--color-error:oklch(72% 0.16 27);--color-scrim:oklch(8% 0.01 262 / 0.65);
  --color-plate:oklch(11% 0.012 262);--color-plate-rule:oklch(30% 0.014 262);
}}
@media (max-width:760px){:root{--gutter:16px;--hdr-h:56px;--nav-h:64px;--text-fig:2.1rem}}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;overflow-x:clip;background:var(--color-paper);color:var(--color-ink)}
html{scrollbar-color:var(--color-muted) var(--color-paper);scroll-padding-top:calc(var(--hdr-h) + var(--space-md))}
body{font-family:var(--font-body);font-size:var(--text-sm);line-height:1.55;font-variant-numeric:tabular-nums;font-synthesis:none;-webkit-font-smoothing:antialiased;caret-color:var(--color-accent);min-height:100dvh;padding-bottom:var(--nav-h)}
::selection{background:var(--color-accent-2);color:var(--color-plate)}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
button,select,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:0.18em}
a:hover{color:var(--color-accent)}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--tracking-display);line-height:1.05;overflow-wrap:break-word;min-width:0;text-wrap:balance}
h1{font-size:var(--text-3xl)}h2{font-size:var(--text-xl)}h3{font-size:var(--text-md);letter-spacing:-0.01em;line-height:1.25}h4{font-size:var(--text-sm);letter-spacing:0}
p{margin:0;text-wrap:pretty}
ul,ol{margin:0;padding-left:1.25em}
svg{display:block}
[hidden]{display:none!important}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mini{font-size:var(--text-xs);color:var(--color-muted);font-weight:500}
.muted{color:var(--color-muted)}
.mono,code{font-family:var(--font-body)}
.num{font-variant-numeric:tabular-nums}
.pre-wrap{white-space:pre-wrap}
.mt-xs{margin-top:var(--space-xs)}.mt-sm{margin-top:var(--space-sm)}.mt-md{margin-top:var(--space-md)}.mt-lg{margin-top:var(--space-lg)}.mt-xl{margin-top:var(--space-xl)}.mb-xs{margin-bottom:var(--space-xs)}.mb-sm{margin-bottom:var(--space-sm)}.mb-lg{margin-bottom:var(--space-lg)}
.unk{color:var(--color-muted)}

/* ---------- controls: square, 2px ink borders, eight states ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs);min-height:var(--ctl-h);padding:0 var(--space-md);border:var(--rule-bar) solid var(--color-ink);border-radius:var(--radius-card);background:transparent;color:var(--color-ink);font-weight:500;font-size:var(--text-sm);line-height:1;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color var(--dur-micro) steps(1),color var(--dur-micro) steps(1),border-color var(--dur-micro) steps(1)}
.btn:hover{background:var(--color-paper-2);color:var(--color-ink)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:0.45;cursor:not-allowed;transform:none}
.btn.on,.btn[aria-pressed="true"]{background:var(--color-ink);color:var(--color-paper);border-color:var(--color-ink)}
.btn.primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink);font-weight:800}
.btn.primary:hover{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-paper)}
.btn.quiet{border-color:var(--color-rule)}
.btn.quiet:hover{border-color:var(--color-ink)}
.btn.danger{color:var(--color-error);border-color:currentColor}
.btn.danger:hover{background:var(--color-error);color:var(--color-paper-3);border-color:var(--color-error)}
.btn.sm{min-height:32px;padding:0 var(--space-sm);font-size:var(--text-xs)}
.btn.icon{width:var(--ctl-h);padding:0}
.btn.link{border-color:transparent;padding:0 var(--space-2xs);text-decoration:underline;text-underline-offset:0.2em}
.btn.link:hover{background:transparent;color:var(--color-accent)}
.btn[aria-busy="true"]{cursor:progress;opacity:0.7}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--color-focus);outline-offset:2px}
/* joined cells: a choice set sharing 2px borders; the chosen cell fills ink */
.cells{display:inline-flex;flex-wrap:wrap}
.cells>*{margin-left:calc(-1 * var(--rule-bar))}
.cells>*:first-child{margin-left:0}
.cells>*:focus-visible{position:relative;z-index:1}
.cells a.btn[aria-current="page"],.cells .btn[aria-checked="true"],.cells .btn[aria-selected="true"]{background:var(--color-ink);color:var(--color-paper)}
.field,.filters input,.filters select,select.btn,input[type=text],input[type=search],input[type=password],input[type=date],input[type=number],textarea{min-height:var(--ctl-h);border:var(--rule-bar) solid var(--color-ink);border-radius:var(--radius-card);background:var(--color-paper-3);color:var(--color-ink);padding:0 var(--space-sm);font-size:var(--text-sm);transition:border-color var(--dur-micro) steps(1)}
textarea{padding:var(--space-xs) var(--space-sm);line-height:1.5;width:100%;resize:vertical;display:block}
select.btn,.filters select{appearance:none;-webkit-appearance:none;padding-right:2rem;font-weight:500;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--color-ink) 50%),linear-gradient(135deg,var(--color-ink) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.btn.sm{padding-right:2rem}
#datalink[aria-current="page"]{background:var(--color-ink);color:var(--color-paper);border-color:var(--color-ink)}
select.btn:hover,.field:hover,input:hover,textarea:hover{border-color:var(--color-accent)}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--color-focus);outline-offset:1px}
input::placeholder,textarea::placeholder{color:var(--color-muted);opacity:1}
input:disabled,select:disabled,textarea:disabled{opacity:0.5;cursor:not-allowed}
input[aria-invalid="true"],.nomatch{border-color:var(--color-error)!important}
label.lbl,.evgrid label{display:flex;flex-direction:column;gap:var(--space-2xs);font-size:var(--text-xs);font-weight:500;color:var(--color-muted)}
.evgrid label>*{color:var(--color-ink)}
.check{display:inline-flex;align-items:center;gap:var(--space-xs);font-size:var(--text-xs);font-weight:500;cursor:pointer;min-height:32px}
.check input{width:18px;height:18px;margin:0;accent-color:var(--color-accent)}

/* ---------- small signs: status glyphs, line squares, tags, pills ---------- */
.sg{display:inline-flex;width:13px;height:13px;flex:none;vertical-align:-2px}
.sg svg{width:100%;height:100%}
.sg-ns,.sg-done{color:var(--color-ink)}.sg-ip{color:var(--color-accent)}.sg-locked{color:var(--color-muted)}.sg-warn{color:var(--color-ink)}
.ln{display:inline-block;width:10px;height:10px;flex:none;background:var(--line-career);vertical-align:0}
.ln-net{background:var(--line-net)}.ln-lnx{background:var(--line-lnx)}.ln-code{background:var(--line-code)}.ln-ctr{background:var(--line-ctr)}.ln-cloud{background:var(--line-cloud)}.ln-sec{background:var(--line-sec)}.ln-csec{background:var(--line-csec)}.ln-career{background:var(--line-career)}
.tag,.badge,.srcb{display:inline-flex;align-items:center;gap:var(--space-2xs);min-height:22px;padding:0 var(--space-xs);border:var(--rule-hair) solid var(--color-rule);font-size:var(--text-xs);font-weight:500;line-height:1.2;color:var(--color-ink-2);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:var(--space-2xs);min-height:22px;padding:0 var(--space-sm);border-radius:var(--radius-pill);border:var(--rule-hair) solid var(--color-ink);font-size:var(--text-xs);font-weight:500;white-space:nowrap}
.pill.ip{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink)}
.pill.done{background:var(--color-ink);color:var(--color-paper)}
.pill.locked{border-color:var(--color-rule);color:var(--color-muted)}
.badge.late,.badge.noev,.pill.warn,.badge.bad{background:var(--color-accent-2);border-color:var(--color-accent-2);color:var(--color-plate)}
.badge.ip{background:var(--color-accent-soft);border-color:var(--color-accent-soft);color:var(--color-ink)}
.badge.rec{background:var(--color-ink);color:var(--color-paper);border-color:var(--color-ink)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-xs)}
.chip{display:inline-flex;align-items:center;gap:var(--space-xs);min-height:32px;max-width:100%;padding:0 var(--space-sm);border:var(--rule-hair) solid var(--color-rule);background:var(--color-paper-3);font-size:var(--text-xs);font-weight:500;cursor:pointer;text-align:left;transition:border-color var(--dur-micro) steps(1)}
.chip:hover{border-color:var(--color-ink)}
.chip:active{transform:translateY(1px)}
.chip .cid{color:var(--color-muted)}
.bar{display:flex;height:8px;min-width:60px;flex:1;background:var(--color-paper-2);border:var(--rule-hair) solid var(--color-ink-rule);overflow:hidden}
.bar.fixed{flex:none}
.bar span{display:block;height:100%}
.b-done{background:var(--color-ink)}.b-ip{background:var(--color-accent)}.b-cool{background:var(--color-accent)}
.note,.warn,.blockmsg{padding:var(--space-sm) var(--space-md);border:var(--rule-bar) solid var(--color-ink);background:var(--color-paper-3);font-size:var(--text-sm)}
.warn{border-color:var(--color-accent-2);background:var(--color-amber-soft)}
.blockmsg{border-style:dashed}
.blockmsg .chips{margin-top:var(--space-xs)}

/* ---------- shell: top bar, nav, notices ---------- */
.top{position:sticky;top:0;z-index:var(--z-sticky);display:flex;align-items:center;gap:var(--space-md);height:var(--hdr-h);padding:0 var(--gutter);background:var(--color-paper);border-bottom:var(--rule-bar) solid var(--color-ink)}
.brand{display:flex;align-items:baseline;gap:var(--space-xs);text-decoration:none;white-space:nowrap}
.brand b{font-size:var(--text-lg);font-weight:800;letter-spacing:-0.03em}
.brand .ver{font-size:var(--text-xs);color:var(--color-muted)}
#nav{display:flex}
#nav a{min-height:var(--ctl-h);padding:0 var(--space-lg);font-weight:800}
#nav a .nsub{display:none}
.top .spacer{flex:1}
.hsearch{position:relative;width:min(300px,26vw)}
.hsearch input{width:100%}
.hsearch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:inherit;font-size:var(--text-xs);color:var(--color-muted);border:var(--rule-hair) solid var(--color-rule);padding:0 var(--space-2xs);pointer-events:none}
.hprog{display:flex;align-items:center;gap:var(--space-xs);font-size:var(--text-xs);font-weight:500;white-space:nowrap}
.hprog .bar{width:84px;flex:none}
.findbtn{display:none}
#notice:empty{display:none}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-md);padding:var(--space-sm) var(--gutter);background:var(--color-plate);color:var(--color-plate-ink);border-bottom:var(--rule-bar) solid var(--color-plate)}
.notice b{color:var(--color-accent-2);font-weight:800}
.notice .acts{display:flex;gap:var(--space-xs);margin-left:auto}
.notice .btn{border-color:var(--color-plate-ink);color:var(--color-plate-ink)}
.notice .btn:hover{background:var(--color-plate-ink);color:var(--color-plate)}
.notice .btn.primary{background:var(--color-accent-2);border-color:var(--color-accent-2);color:var(--color-plate)}
.notice .details{flex-basis:100%;font-size:var(--text-xs);color:var(--color-plate-muted)}

/* ---------- pages ---------- */
main{min-width:0}
.view{display:none}
.view.on{display:block}
.page{width:100%;max-width:var(--container);margin-inline:auto;padding:var(--space-xl) var(--gutter) var(--space-3xl)}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-md) var(--space-lg);margin-bottom:var(--space-lg)}
.phead .lead,.lead{max-width:64ch;color:var(--color-ink-2);font-size:var(--text-sm);margin-top:var(--space-xs)}
.box{border:var(--rule-bar) solid var(--color-ink);background:var(--color-paper-3);padding:var(--space-lg)}
.boxhead{display:flex;align-items:center;gap:var(--space-md);flex-wrap:wrap}
.boxhead h3{flex:1}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-md);margin-bottom:var(--space-sm);padding-bottom:var(--space-xs);border-bottom:var(--rule-bar) solid var(--color-ink)}
.sechead h2{font-size:var(--text-lg)}
table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
th{text-align:left;font-weight:500;font-size:var(--text-xs);color:var(--color-muted);padding:var(--space-xs) var(--space-sm);border-bottom:var(--rule-bar) solid var(--color-ink);vertical-align:bottom}
td{padding:var(--space-sm);border-bottom:var(--rule-hair) solid var(--color-rule);vertical-align:top}
tr.cl:hover td{background:var(--color-paper-2)}
.tablewrap{overflow-x:auto}

/* ---------- today ---------- */
.day{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-lg);margin-bottom:var(--space-xl)}
.day h1{font-size:var(--text-3xl)}
.day .date{display:block;font-size:var(--text-sm);font-weight:500;color:var(--color-muted);letter-spacing:0;margin-bottom:var(--space-xs)}
.signs{display:flex;flex-wrap:wrap}
.sign{display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-2xs);min-width:7.5rem;padding:var(--space-sm) var(--space-md);border:var(--rule-bar) solid var(--color-ink);margin-left:calc(-1 * var(--rule-bar));text-decoration:none;background:var(--color-paper-3)}
.sign:first-child{margin-left:0}
.sign .fig{font-size:var(--text-fig);font-weight:800;line-height:0.95;letter-spacing:-0.04em}
.sign .fig small{font-size:var(--text-md);font-weight:500;color:var(--color-muted);letter-spacing:0}
.sign .l{font-size:var(--text-xs);font-weight:500;color:var(--color-ink-2)}
a.sign:hover{background:var(--color-paper-2);color:var(--color-ink)}
.sign.live{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink);position:relative;z-index:1}
.sign.live .l{color:var(--color-accent-ink)}
.sign.live:hover{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-paper)}
.sign.live:hover .l{color:var(--color-paper)}
.tgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--space-xl);align-items:start}
.tcol{display:flex;flex-direction:column;gap:var(--space-xl);min-width:0}
.live-list{display:flex;flex-direction:column;gap:var(--space-md)}
.livecard{border:var(--rule-bar) solid var(--color-ink);background:var(--color-paper-3)}
.livecard .lc-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2xs) var(--space-md);align-items:start;padding:var(--space-md) var(--space-md) var(--space-sm)}
.lc-id{display:flex;align-items:center;gap:var(--space-xs);font-weight:800;font-size:var(--text-sm)}
.livecard h3{font-size:var(--text-lg);letter-spacing:-0.02em}
.lc-meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:var(--space-2xs) var(--space-md);font-size:var(--text-xs);color:var(--color-muted);font-weight:500}
.lc-meta b{color:var(--color-ink);font-weight:800}
.marks{display:inline-flex;gap:var(--space-2xs)}
.mk{display:inline-grid;place-items:center;width:20px;height:20px;border:var(--rule-hair) solid var(--color-ink-rule);font-size:11px;font-weight:800;color:var(--color-muted)}
.mk.partial{border-color:var(--color-accent);color:var(--color-accent)}
.mk.verified{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-paper)}
.mk.regressed{background:var(--color-accent-2);border-color:var(--color-accent-2);color:var(--color-plate)}
.logf{border-top:var(--rule-bar) solid var(--color-ink);padding:var(--space-md);display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-sm);background:var(--color-paper)}
.logf textarea{min-height:64px}
.logrow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm)}
.logrow .cells .btn{min-width:52px;padding:0 var(--space-sm)}
.logrow input[type=number]{width:5.5rem}
.logrow .grow{flex:1}
.logok{font-size:var(--text-xs);font-weight:500;color:var(--color-accent)}
.logok:empty{display:none}
.empty{padding:var(--space-lg);border:var(--rule-bar) dashed var(--color-ink-rule);color:var(--color-ink-2)}
.empty p+p{margin-top:var(--space-xs)}
/* the departure board */
.board{background:var(--color-plate);color:var(--color-plate-ink);border:var(--rule-bar) solid var(--color-plate)}
.board .bhead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-sm);padding:var(--space-md) var(--space-md) var(--space-sm);border-bottom:var(--rule-bar) solid var(--color-plate-ink)}
.board .bhead h2{font-size:var(--text-lg)}
.board .bhead .fig{color:var(--color-accent-2);font-weight:800;font-size:var(--text-xl)}
.board ol{list-style:none;padding:0;margin:0}
.board li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2xs) var(--space-sm);align-items:center;padding:var(--space-sm) var(--space-md);border-bottom:var(--rule-hair) solid var(--color-plate-rule)}
.board .bid{font-weight:800;color:var(--color-accent-2);min-width:4.4rem}
.board .bname{display:block;font-weight:500;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--color-plate-ink);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:0.2em}
.board .bname:hover{text-decoration-color:currentColor}
.board .bsub{display:flex;align-items:center;gap:var(--space-xs);font-size:var(--text-xs);color:var(--color-plate-muted)}
.board .btn{border-color:var(--color-plate-ink);color:var(--color-plate-ink)}
.board .btn:hover{background:var(--color-plate-ink);color:var(--color-plate)}
.board .bfoot{padding:var(--space-sm) var(--space-md);font-size:var(--text-xs)}
.board .bfoot a{color:var(--color-plate-ink)}
.board .bfoot a:hover{color:var(--color-accent-2)}
.board .bempty{padding:var(--space-md);color:var(--color-plate-muted)}
.attn{list-style:none;padding:0;margin:0;border-top:var(--rule-bar) solid var(--color-ink)}
.attn li{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);padding:var(--space-sm) 0;border-bottom:var(--rule-hair) solid var(--color-rule)}
.attn li>span:first-child{flex:1;min-width:12rem}
.week td{padding:var(--space-xs) var(--space-sm)}
.week .wid{font-weight:800;white-space:nowrap}
.week .wtot{font-weight:800}

/* ---------- roadmap: lens bar, filters ---------- */
.rbar{position:sticky;top:var(--hdr-h);z-index:var(--z-raised);background:var(--color-paper);border-bottom:var(--rule-bar) solid var(--color-ink)}
.rbar-in{max-width:var(--container);margin-inline:auto;padding:var(--space-sm) var(--gutter);display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm) var(--space-lg)}
.rbar h1{font-size:var(--text-xl);margin-right:var(--space-xs)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs)}
.filters input[type=search]{width:13rem}
.filters select{width:11.5rem}
.rbar .filters{flex-basis:100%}
.filters .count{margin-left:var(--space-xs)}
.ftog{display:none}
.lens{display:none}
.lens.on{display:block}
.fit{max-width:var(--container);margin-inline:auto;padding:var(--space-lg) var(--gutter) var(--space-3xl)}
/* list */
.stageblock+.stageblock{margin-top:var(--space-xl)}
.stagehead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--space-2xs) var(--space-md);padding-bottom:var(--space-sm);border-bottom:var(--rule-bar) solid var(--color-ink)}
.stno{display:grid;place-items:center;width:48px;height:48px;background:var(--color-ink);color:var(--color-paper);font-weight:800;font-size:var(--text-xl)}
.stagehead h2{font-size:var(--text-xl)}
.stagehead .sw{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);margin-top:var(--space-2xs);font-size:var(--text-xs);color:var(--color-muted);font-weight:500}
.stagehead .sfig{font-weight:800;font-size:var(--text-xl);text-align:right}
.stagehead .sfig small{font-size:var(--text-xs);color:var(--color-muted);font-weight:500}
.stagehead .sbar{grid-column:2/4;display:flex;align-items:center;gap:var(--space-sm)}
.ctable{table-layout:fixed}
.ctable td{vertical-align:middle;padding:var(--space-xs) var(--space-sm)}
.ctable select.btn{width:100%;min-height:34px;font-size:var(--text-xs)}
.ctable .idc a{font-weight:800;text-decoration:none}
.ctable .idc a:hover{text-decoration:underline}
.ctable .cname{font-weight:500}
.ctable .ctags{display:flex;flex-wrap:wrap;gap:var(--space-2xs);margin-top:var(--space-2xs)}
.ctable .lane{display:flex;align-items:center;gap:var(--space-xs);font-size:var(--text-xs)}
.wait{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2xs);font-size:var(--text-xs)}
.wait .lbl{color:var(--color-muted);font-weight:500}
.wait a{font-weight:800;text-decoration:none;border-bottom:var(--rule-bar) solid var(--color-ink)}
.wait a:hover{color:var(--color-accent);border-color:var(--color-accent)}
.wait .ok{color:var(--color-accent);font-weight:500}
tr.st-done .cname{color:var(--color-muted)}
.nores{padding:var(--space-xl) 0}
/* board (kanban) */
.kswitch{display:none}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-md);align-items:start}
.kcol{border:var(--rule-bar) solid var(--color-ink);background:var(--color-paper-2);min-height:200px}
.kcol.over{background:var(--color-accent-soft);border-color:var(--color-accent)}
.kcol.nodrop{border-style:dashed}
.khead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-xs);flex-wrap:wrap;padding:var(--space-sm) var(--space-md);background:var(--color-ink);color:var(--color-paper)}
.khead b{font-weight:800}
.khead .num{font-weight:800;font-size:var(--text-lg);color:var(--color-accent-2)}
.kcol[data-col="ip"] .khead{background:var(--color-accent);color:var(--color-accent-ink)}
.kcol[data-col="ip"] .khead .num{color:var(--color-accent-ink)}
.khead .mini{flex-basis:100%;color:inherit;opacity:0.8}
.kbody{display:flex;flex-direction:column;gap:var(--space-xs);padding:var(--space-sm);max-height:calc(100dvh - var(--hdr-h) - 220px);overflow:auto}
.kcard{border:var(--rule-bar) solid var(--color-ink);background:var(--color-paper-3);padding:var(--space-sm);cursor:grab;transition:border-color var(--dur-micro) steps(1)}
.kcard:hover{border-color:var(--color-accent)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:0.4}
.kname{font-weight:500;line-height:1.3}
.kmeta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2xs) var(--space-xs);margin-top:var(--space-xs);font-size:var(--text-xs);color:var(--color-muted)}
.kmeta .cid{font-weight:800;color:var(--color-ink)}
.knote{margin-top:var(--space-xs);font-size:var(--text-xs);color:var(--color-ink-2)}
.knote.ip{color:var(--color-accent)}
.knote.noev{display:inline-block;background:var(--color-accent-2);color:var(--color-plate);padding:0 var(--space-xs)}
.kempty{padding:var(--space-md);font-size:var(--text-xs);color:var(--color-muted)}

/* ---------- route: the signature ---------- */
.rhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-md);margin-bottom:var(--space-lg)}
.rhead .lead{margin:0}
.rgo{display:flex;gap:var(--space-xs)}
.rgo input{width:16rem}
.route{position:relative}
.rlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.rlines path{fill:none;stroke:var(--color-ink);stroke-width:2}
.rlines path.hot{stroke:var(--color-accent);stroke-width:3}
.rcols{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-xl);align-items:center}
.rcol{display:flex;flex-direction:column;gap:var(--space-sm);min-width:0}
.rcol>h3{font-size:var(--text-xs);font-weight:500;color:var(--color-muted);letter-spacing:0;padding-bottom:var(--space-2xs);border-bottom:var(--rule-hair) solid var(--color-rule)}
.rcol.empty-col>h3{border-bottom-style:dashed}
.rcol .more{font-size:var(--text-xs);color:var(--color-muted)}
.stn{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2xs) var(--space-xs);align-items:start;width:100%;padding:var(--space-sm);border:var(--rule-bar) solid var(--color-ink);background:var(--color-paper-3);text-align:left;cursor:pointer;transition:border-color var(--dur-micro) steps(1),background-color var(--dur-micro) steps(1)}
.stn:hover{border-color:var(--color-accent);background:var(--color-paper)}
.stn:active{transform:translateY(1px)}
.stn .sid{display:flex;align-items:center;gap:var(--space-xs);font-weight:800;font-size:var(--text-xs)}
.stn .snm{grid-column:1/3;font-size:var(--text-sm);font-weight:500;line-height:1.3}
.stn .sst{grid-column:1/3;font-size:var(--text-xs);color:var(--color-muted)}
.stn.st-done{background:var(--color-paper-2)}
.stn.st-ip{border-color:var(--color-accent);box-shadow:inset 4px 0 0 var(--color-accent)}
.stn.st-locked{border-style:dashed;border-color:var(--color-ink-rule)}
.here{border:var(--rule-bar) solid var(--color-plate);background:var(--color-plate);color:var(--color-plate-ink);padding:var(--space-lg)}
.here .hid{display:flex;align-items:center;gap:var(--space-sm);font-weight:800;font-size:var(--text-fig);line-height:1;letter-spacing:-0.04em;color:var(--color-accent-2)}
.here .hid .ln{width:16px;height:16px}
.here h2{margin-top:var(--space-sm);font-size:var(--text-lg);color:var(--color-plate-ink)}
.here .hline{margin-top:var(--space-xs);font-size:var(--text-xs);color:var(--color-plate-muted)}
.here .hstate{display:flex;flex-wrap:wrap;gap:var(--space-xs);margin-top:var(--space-md)}
.here .hstate .pill{border-color:var(--color-plate-ink)}
.here .pill.locked{color:var(--color-plate-muted);border-color:var(--color-plate-muted)}
.here .pill.done{background:var(--color-plate-ink);color:var(--color-plate)}
.here .hacts{display:flex;flex-wrap:wrap;gap:var(--space-xs);margin-top:var(--space-md)}
.here .btn{border-color:var(--color-plate-ink);color:var(--color-plate-ink)}
.here .btn:hover{background:var(--color-plate-ink);color:var(--color-plate)}
.here .btn.primary{background:var(--color-accent-2);border-color:var(--color-accent-2);color:var(--color-plate)}
.here .btn.primary:hover{background:var(--color-plate-ink);border-color:var(--color-plate-ink)}
.rlegend{display:flex;flex-wrap:wrap;gap:var(--space-xs) var(--space-lg);margin-top:var(--space-xl);padding-top:var(--space-sm);border-top:var(--rule-hair) solid var(--color-rule);font-size:var(--text-xs);color:var(--color-muted)}
.rlegend span{display:inline-flex;align-items:center;gap:var(--space-xs)}
.rlegend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--color-ink)}
.rlegend i.hot{border-top:3px solid var(--color-accent)}
.rlegend i.dash{height:12px;width:16px;border:2px dashed var(--color-ink-rule)}

/* ---------- map: the whole network (zoomable SVG) ---------- */
.maptool{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-md);max-width:var(--container);margin-inline:auto;padding:var(--space-sm) var(--gutter)}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-2xs) var(--space-md);font-size:var(--text-xs);color:var(--color-ink-2)}
.legend span{display:inline-flex;align-items:center;gap:var(--space-2xs)}
.lg-line{display:inline-block;width:18px;height:0;border-top:2px solid var(--color-ink)}
.lg-needs{border-top-color:var(--color-ink)}
.lg-unlocks{border-top:3px solid var(--color-accent)}
.lg-box{display:inline-block;width:14px;height:10px;border:var(--rule-bar) solid var(--color-ink)}
.lg-box.dash{border-style:dashed}
.lg-box.stack{box-shadow:3px -3px 0 -1px var(--color-paper),3px -3px 0 1px var(--color-ink)}
.legwrap summary{list-style:none}
.legwrap summary::-webkit-details-marker{display:none}
.legwrap[open] summary{display:none}
.canvas{position:relative;height:calc(100dvh - var(--hdr-h) - var(--nav-h) - 120px);min-height:380px;overflow:hidden;background:var(--color-paper);border-top:var(--rule-bar) solid var(--color-ink);touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--color-rule) 1px,transparent 1.2px);background-size:24px 24px}
.canvas.drag{cursor:grabbing}
.canvas svg{width:100%;height:100%}
.zoombox{position:absolute;right:var(--space-md);bottom:var(--space-md);display:flex;flex-direction:column;background:var(--color-paper-3)}
.zoombox .btn{width:40px;padding:0;margin-top:calc(-1 * var(--rule-bar))}
.zoombox .btn:first-child{margin-top:0}
.node{cursor:pointer}
.node .box{fill:var(--color-paper-3);stroke:var(--color-ink);stroke-width:1.5}
.node .under{fill:var(--color-paper-3);stroke:var(--color-ink);stroke-width:1.5}
.node .nt{fill:var(--color-ink);font-weight:500;font-family:var(--font-body)}
.node .nsub{fill:var(--color-muted);font-family:var(--font-body)}
.node .ndot{fill:none;stroke:var(--color-ink);stroke-width:1.5}
.node .nlock{color:var(--color-muted)}
.node.exist .box{stroke-dasharray:5 3}
.node.st-ip .box{stroke:var(--color-accent);stroke-width:3}
.node.st-ip .ndot{fill:var(--color-accent);stroke:var(--color-accent)}
.node.st-done .box{fill:var(--color-paper-2)}
.node.st-done .ndot{fill:var(--color-ink)}
.node.blk.st-ns .box{stroke:var(--color-ink-rule);stroke-dasharray:4 3}
.node:hover .box{stroke:var(--color-accent)}
.node:focus{outline:none}
.node:focus-visible .box{stroke:var(--color-focus);stroke-width:4}
.node.sel .box{fill:var(--color-plate);stroke:var(--color-plate)}
.node.sel .nt{fill:var(--color-plate-ink)}
.node.sel .nsub{fill:var(--color-plate-muted)}
.node.sel .ndot{stroke:var(--color-accent-2)}
.node.dim{opacity:0.18}
.stagehd{cursor:pointer}
.colh{fill:var(--color-ink);font-weight:800;font-family:var(--font-body)}
.colsub{fill:var(--color-muted);font-family:var(--font-body)}
.bandrule{stroke:var(--color-ink);stroke-width:2}
.edge{fill:none;stroke:var(--color-ink-rule);stroke-width:1.25;opacity:0.55}
.arrowhead{fill:var(--color-ink-rule)}
svg.has-sel .edge{opacity:0.12}
svg.has-sel .edge.in{opacity:1;stroke:var(--color-ink);stroke-width:2.5}
svg.has-sel .edge.out{opacity:1;stroke:var(--color-accent);stroke-width:3}
svg.chain .edge.off{opacity:0}

/* ---------- drawer: Track | Learn ---------- */
#panel{position:fixed;top:var(--hdr-h);right:0;bottom:0;z-index:var(--z-panel);width:min(var(--panel-w),100%);display:flex;flex-direction:column;background:var(--color-paper-3);border-left:var(--rule-bar) solid var(--color-ink);transform:translateX(102%);visibility:hidden}
#panel.on{transform:none;visibility:visible;transition:transform var(--dur-short) var(--ease-out),visibility 0s}
.ph{flex:none;padding:var(--space-md) var(--space-lg) 0;border-bottom:var(--rule-bar) solid var(--color-ink);background:var(--color-paper-3)}
.ph-top{display:flex;align-items:center;gap:var(--space-sm)}
.pid{display:flex;align-items:center;gap:var(--space-xs);font-weight:800;font-size:var(--text-sm);flex:1}
.ph h2{margin-top:var(--space-xs);font-size:var(--text-xl)}
.ph h2:focus{outline:none}
.ph h2:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
.badges{display:flex;flex-wrap:wrap;gap:var(--space-2xs);margin-top:var(--space-sm)}
.statusset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:var(--space-md)}
.statusset button{min-height:44px;border:var(--rule-bar) solid var(--color-ink);margin-left:calc(-1 * var(--rule-bar));background:transparent;font-weight:500;cursor:pointer;transition:background-color var(--dur-micro) steps(1)}
.statusset button:first-child{margin-left:0}
.statusset button:hover{background:var(--color-paper-2)}
.statusset button:active{transform:translateY(1px)}
.statusset button:focus-visible{position:relative;z-index:1}
.statusset button.on{background:var(--color-ink);color:var(--color-paper);font-weight:800}
.statusset button[data-s="ip"].on{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink);position:relative}
.ptabs{display:flex;gap:var(--space-lg);margin-top:var(--space-md)}
.ptabs button{min-height:44px;padding:0;border:0;border-bottom:4px solid transparent;background:none;font-weight:500;color:var(--color-muted);cursor:pointer}
.ptabs button:hover{color:var(--color-ink)}
.ptabs button[aria-selected="true"]{color:var(--color-ink);font-weight:800;border-bottom-color:var(--color-ink)}
.pb{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:var(--space-lg) var(--space-lg) var(--space-2xl)}
.sec+.sec{margin-top:var(--space-lg)}
.sec>h3{font-size:var(--text-xs);font-weight:500;color:var(--color-muted);letter-spacing:0;margin-bottom:var(--space-xs)}
.sec p,.sec li{font-size:var(--text-sm)}
.sec li+li{margin-top:var(--space-2xs)}
.evgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-sm)}
.evgrid .wide{grid-column:1/3}
.evgrid select,.evgrid input{width:100%}
.ptrack .logf{border:var(--rule-bar) solid var(--color-ink);margin-bottom:var(--space-lg)}
.ptrack .logf h3{font-size:var(--text-sm);letter-spacing:0}
.sessions{list-style:none;padding:0;margin:0;border-top:var(--rule-bar) solid var(--color-ink)}
.sessions li{display:grid;grid-template-columns:5.2rem 3.4rem minmax(0,1fr) auto;gap:var(--space-xs);align-items:baseline;padding:var(--space-xs) 0;border-bottom:var(--rule-hair) solid var(--color-rule);font-size:var(--text-xs)}
.sessions li+li{margin-top:0}
.sessions .sd{font-weight:800}
.sessions .st{white-space:pre-wrap;color:var(--color-ink-2);font-size:var(--text-sm)}
.minirt{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:var(--space-sm);align-items:center}
.minirt .rarrow{font-weight:800;color:var(--color-muted)}
.minirt .chips{flex-direction:column;align-items:stretch}
.minirt .self{padding:var(--space-xs) var(--space-sm);background:var(--color-plate);color:var(--color-accent-2);font-weight:800;text-align:center}
.scrim{display:none}

/* ---------- plan ---------- */
.subnav{margin-bottom:var(--space-xl)}
.planpart{display:none}
.planpart.on{display:block}
.pathpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0;margin-bottom:var(--space-xl)}
.pathcard{display:flex;flex-direction:column;gap:var(--space-xs);padding:var(--space-md);border:var(--rule-bar) solid var(--color-ink);margin:0 0 0 calc(-1 * var(--rule-bar));background:var(--color-paper-3);text-align:left;cursor:pointer;transition:background-color var(--dur-micro) steps(1)}
.pathcard:hover{background:var(--color-paper-2)}
.pathcard:active{transform:translateY(1px)}
.pathcard.on{background:var(--color-ink);color:var(--color-paper);position:relative;z-index:1}

  #panel{top:0;width:100%;border-left:0;z-index:var(--z-modal)}

<script>
"use strict";
const D = /*DATA*/null;
const KEY = "ntidebi-roadmap-v1";
const SRC_LABEL = {NTI:"NTI",DEBI:"DEBI",IND:"Independent",SHARED:"Shared",EXIST:"Existing"};
const ST_LABEL = {ns:"Not started",ip:"In progress",done:"Completed"};
const PRI = {H:"High",M:"Medium",L:"Low"};
const byId = Object.fromEntries(D.comps.map(c=>[c.id,c]));
const stageById = Object.fromEntries(D.stages.map(s=>[s.id,s]));
const pathById = Object.fromEntries(D.paths.map(p=>[p.id,p]));
const dependents = {}; D.comps.forEach(c=>dependents[c.id]=[]);
D.comps.forEach(c=>c.pre.forEach(p=>dependents[p].push(c.id)));
const projByComp = {}; D.projects.forEach(p=>p.comps.forEach(id=>(projByComp[id]=projByComp[id]||[]).push(p.id)));

/* ---------- storage (v2 envelope; see development/ARCHITECTURE.md §5) ---------- */
const APP_ID = "nti-debi-roadmap";
const KEY1 = "ntidebi-roadmap-v1", KEY2 = "ntidebi-roadmap-v2";
const KEY1_BACKUP = KEY1 + "-backup", KEY2_PREV = KEY2 + "-prev";
const LEVELS = ["E0","E1","E2","E3","E4"];
const MARKS = {none:"Not assessed",partial:"Partial",verified:"Verified",regressed:"Regressed"};
const DAY = 864e5, BACKUP_DAYS = 7;
/* Session log (owner-entered only): progress[ID].log = [{d:"YYYY-MM-DD", min?, text?, lv?}], newest first. */
const LOG_MAX = 1000;
let storageOK = true;
const has = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const nowISO = () => new Date().toISOString();
const isObj = o => !!o && typeof o === "object" && !Array.isArray(o);
const str = (v,max) => typeof v === "string" ? v.slice(0,max) : undefined;
const isoOK = v => typeof v === "string" && !isNaN(Date.parse(v));
function blankEnv(){return {app:APP_ID,storageVersion:2,dataVersion:D.version,createdAt:nowISO(),savedAt:null,lastChangeAt:null,lastExportAt:null,seen:null,firstRunDismissed:false,progress:{},orphans:{}}}
/* One progress entry: keep only known fields with valid values. */
function cleanEntry(o){
  if(!isObj(o))return null;const e={};
  if(has(ST_LABEL,o.status))e.status=o.status;
  for(const [k,max] of [["notes",20000],["evidence",20000],["link",2000],["levelNote",120]]){const s=str(o[k],max);if(s)e[k]=s}
  if(LEVELS.includes(o.level))e.level=o.level;
  for(const k of ["u","e","d"])if(has(MARKS,o[k]))e[k]=o[k];
  if(typeof o.lastVerified==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(o.lastVerified))e.lastVerified=o.lastVerified;
  if(isoOK(o.updated))e.updated=o.updated;
  if(Array.isArray(o.log)){const log=o.log.filter(isObj).map(x=>{const s={};
      if(typeof x.d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x.d))s.d=x.d;else return null;
      if(Number.isInteger(x.min)&&x.min>0&&x.min<=600)s.min=x.min;const t=str(x.text,1000);if(t)s.text=t;if(LEVELS.includes(x.lv))s.lv=x.lv;
      return s.min||s.text?s:null}).filter(Boolean).slice(0,LOG_MAX);
    if(log.length)e.log=log}
  return Object.keys(e).length?e:null}
/* Read any accepted file shape: v2 envelope, v1 export, or a records seed. Returns null if unrecognised. */
function parseAny(o){
  if(!isObj(o))return null;
  if(o.kind==="roadmap-progress-seed"&&isObj(o.entries)){const entries={};
    for(const [id,v] of Object.entries(o.entries)){if(typeof id!=="string"||!isObj(v))continue;const e=cleanEntry(v)||{};
      const keep={};for(const k of ["level","levelNote","u","e","d","lastVerified"])if(has(e,k))keep[k]=e[k];
      entries[id]=keep}  // an empty entry clears what the records no longer show
    return {kind:"seed",progress:entries,orphans:{},meta:{snapshotDate:str(o.snapshotDate,40)||"",source:str(o.source,200)||""}}}
  if(o.app===APP_ID&&o.storageVersion===2&&isObj(o.progress)){const progress={},orphans={};
    for(const [id,v] of Object.entries(o.progress)){const e=cleanEntry(v);if(e)progress[id]=e}

  if(band.length){sv("line",{class:"bandrule",x1:20,x2:V.W-20,y1:bandY-40,y2:bandY-40},vp);
    sv("text",{class:"colh",x:30,y:bandY-16,"font-size":14},vp).textContent="Ongoing: portfolio and job readiness";

function drawRouteLines(){const R=document.getElementById("route"),svg=document.getElementById("rlines");if(!R||!svg||!R.offsetParent)return;

function lateHTML(){const items=[...D.stages.map(s=>[`Stage ${s.n}: ${s.name}`,lateStage(s)]),...D.projects.map(p=>[`${p.id}: ${p.name}`,lateProject(p)]),...D.certs.map(k=>[k.name,lateCert(k)])].filter(x=>x[1]);

function radarSVG(){
  const L=D.lanes.filter(l=>D.comps.some(c=>c.lane===l.id)),n=L.length,R=120,cx=170,cy=150;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const val=(l,f)=>{const ids=D.comps.filter(c=>c.lane===l.id).map(c=>c.id);return ids.filter(f).length/ids.length};
  const poly=f=>L.map((l,i)=>pt(i,Math.max(0.02,val(l,f))*R).join(",")).join(" ");
  let g="";[0.25,0.5,0.75,1].forEach(k=>{g+=`<polygon class="rgrid" points="${L.map((_,i)=>pt(i,R*k).join(",")).join(" ")}"/>`});
  L.forEach((l,i)=>{const [x,y]=pt(i,R),[tx,ty]=pt(i,R+18);g+=`<line class="rgrid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/><text class="rlab" x="${tx}" y="${ty+4}" text-anchor="${Math.abs(tx-cx)<10?"middle":tx>cx?"start":"end"}">${esc(l.name)} ${Math.round(100*val(l,id=>st(id)==="done"))}%</text>`});
  g+=`<polygon class="rstart" points="${poly(id=>st(id)!=="ns")}"/>`;
  g+=`<polygon class="rdone" points="${poly(id=>st(id)==="done")}"/>`;
  return `<svg class="radar" viewBox="-130 0 600 300" role="img" aria-label="Skills radar by domain: share of each domain completed">${g}</svg>`;
}

/* ---------- import with preview ---------- */
const dlg=document.getElementById("dlg");
const OWN_BY_RECORDS=["level","levelNote","u","e","d","lastVerified"];
const FIELD_LABEL={level:"Level",levelNote:"Records note",u:"Understanding",e:"Execution",d:"Diagnosis",lastVerified:"Last verified"};
function pickImport(){const i=document.createElement("input");i.type="file";i.accept="application/json,.json";i.id="imp-picker";i.style.display="none";
  i.onchange=()=>{const f=i.files[0];i.remove();if(f)readImport(f)};document.body.appendChild(i);i.click()}
function readImport(f){f.text().then(t=>{let parsed=null;try{parsed=parseAny(JSON.parse(t))}catch(_){parsed=null}
  if(!parsed){showDialog(`<h2>Can't import this file</h2><p>It isn't a progress export or a records seed from this app. Nothing was changed.</p><div class="dlgact"><button type="button" class="btn" data-dlg="close">Close</button></div>`);return}
  previewImport(parsed,f.name)})}
function entrySummary(e){if(!e)return "None";const b=[];if(e.status)b.push(ST_LABEL[e.status]);if(e.level)b.push(e.level);if(e.link)b.push("link");if(e.notes)b.push("notes");if(e.log&&e.log.length)b.push(e.log.length+" sessions");if(e.evidence)b.push("evidence notes");return b.join(", ")||"None"}
function seedPlan(parsed){const changes=[],skipped=[];
  for(const [id,v] of Object.entries(parsed.progress)){const r=resolveId(id);if(!r.to){skipped.push(id);continue}
    const cur=P(r.to),diff=OWN_BY_RECORDS.filter(k=>(cur[k]||"")!==(v[k]||""));if(diff.length)changes.push({id:r.to,from:cur,to:v,diff})}
  return {changes,skipped}}
function previewImport(parsed,name){
  if(parsed.kind==="seed"){const {changes,skipped}=seedPlan(parsed);
    const fmt=(e,k)=>esc(k==="u"||k==="e"||k==="d"?(e[k]?MARKS[e[k]]:"Not set"):(e[k]||"Not set"));
    showDialog(`<h2>Import records seed</h2><p class="mini">${esc(name)}${parsed.meta.snapshotDate?`, records snapshot ${esc(parsed.meta.snapshotDate)}`:""}</p>
     <p>The records own <b>level, U/E/D and last verified</b>; your statuses, notes and links stay as they are. The seed never marks anything Completed.</p>
     <p><b>${changes.length}</b> competencies change, ${Object.keys(parsed.progress).length-skipped.length} in the seed match, ${skipped.length} not in this roadmap (skipped${skipped.length?": "+esc(skipped.slice(0,12).join(", "))+(skipped.length>12?"…":""):""})</p>
     ${changes.length?`<div class="dlgscroll"><table><thead><tr><th>ID</th><th>Field</th><th>Now</th><th>From records</th></tr></thead><tbody>${changes.flatMap(c=>c.diff.map((k,i)=>`<tr><td>${i?"":esc(c.id)}</td><td>${esc(FIELD_LABEL[k]||k)}</td><td>${fmt(c.from,k)}</td><td>${fmt(c.to,k)}</td></tr>`)).join("")}</tbody></table></div>`:""}
     <p class="mini">A backup of your current progress is downloaded first.</p>
     <div class="dlgact"><button type="button" class="btn" data-dlg="close">Cancel</button>${changes.length?`<button type="button" class="btn primary" data-dlg="seed">Apply ${changes.length} changes</button>`:""}</div>`,
     {seed:()=>{backupNow("seed");for(const c of changes){const e=entry(c.id);for(const k of OWN_BY_RECORDS){if(has(c.to,k))e[k]=c.to[k];else delete e[k]}}touch();refreshAll()}});
    return}
  const n=normalize(parsed.progress,parsed.orphans);const ids=Object.keys(n.progress);
  const conflicts=ids.filter(id=>S.progress[id]&&JSON.stringify(S.progress[id])!==JSON.stringify(n.progress[id]));
  const fresh=ids.filter(id=>!S.progress[id]);const orph=Object.keys(n.orphans);
  showDialog(`<h2>Import progress</h2><p class="mini">${esc(name)}, ${parsed.kind==="v1"?"older format (converted)":"current format"}</p>
   <p><b>${ids.length}</b> competencies with progress in the file: ${fresh.length} new here, ${conflicts.length} differ from what this browser has, ${n.renamed.length} under an old ID (carried over), ${orph.length} orphaned (kept, shown on the Data page).</p>
   ${conflicts.length?`<div class="dlgscroll"><table><thead><tr><th>ID</th><th>In this browser</th><th>In the file</th></tr></thead><tbody>${conflicts.map(id=>`<tr><td>${esc(id)}</td><td>${esc(entrySummary(S.progress[id]))}</td><td>${esc(entrySummary(n.progress[id]))}</td></tr>`).join("")}</tbody></table></div>`:""}
   <p><b>Merge</b> keeps both: for each competency the newer change wins and differing notes are kept together. <b>Replace</b> makes this browser match the file exactly.</p>
   <p class="mini">A backup of your current progress is downloaded first.</p>
   <div class="dlgact"><button type="button" class="btn" data-dlg="close">Cancel</button><button type="button" class="btn danger" data-dlg="replace">Replace</button><button type="button" class="btn primary" data-dlg="merge">Merge</button></div>`,
   {merge:()=>{backupNow("import");for(const id of ids)S.progress[id]=mergeEntry(S.progress[id],n.progress[id]);for(const id of orph)S.orphans[id]=Object.assign(mergeEntry(S.orphans[id],n.orphans[id]),{reason:n.orphans[id].reason,splitInto:n.orphans[id].splitInto});finishImport(parsed)},
    replace:()=>{backupNow("import");S.progress=n.progress;S.orphans=n.orphans;finishImport(parsed)}});
}
function finishImport(parsed){for(const id of Object.keys(S.orphans))if(!S.orphans[id].splitInto)delete S.orphans[id].splitInto;
  S.firstRunDismissed=true;if(parsed.meta&&parsed.meta.lastExportAt&&!S.lastExportAt)S.lastExportAt=parsed.meta.lastExportAt;touch();refreshAll()}
function showDialog(html,actions){dlg.innerHTML=html;dlg.onclick=e=>{const b=e.target.closest("[data-dlg]");if(!b)return;const a=b.dataset.dlg;dlg.close();if(a!=="close"&&actions&&actions[a])actions[a]()};
  if(dlg.showModal){if(!dlg.open)dlg.showModal()}else dlg.setAttribute("open","")}

/* ---------- lateness (D-10): a window passed with the work not done ---------- */
const today = () => (typeof window.ROADMAP_TODAY==="string"&&!isNaN(Date.parse(window.ROADMAP_TODAY)))?Date.parse(window.ROADMAP_TODAY):Date.now();
const endOfDay = d => Date.parse(d+"T23:59:59");
const monthEnd = ym => {const [y,m]=ym.split("-").map(Number);return new Date(y,m,0,23,59,59).getTime()};
const fmtDate = t => new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
function lateness(dueMs,comps){if(dueMs==null||!comps.length||today()<=dueMs||pct(comps)===100)return null;return {due:dueMs,days:Math.floor((today()-dueMs)/DAY)}}
const lateStage = s => lateness(s.due?endOfDay(s.due):null,compsIn(s.id));
const lateProject = p => lateness(p.due?endOfDay(p.due):null,p.comps);
const lateCert = k => lateness(k.end?monthEnd(k.end):null,k.comps);
const LATE_HINT = "Cut scope or re-plan. Missed time doesn't roll over (doc 18).";
const lateBadge = l => l?`<span class="badge late" title="${esc(LATE_HINT)}">Late: window ended ${esc(fmtDate(l.due))}</span>`:"";

/* ---------- timetable (D-10): committed only as AES-GCM ciphertext; unlocked in the browser ---------- */
const TT_ITER=600000, TT_MIN_PW=14;
let TT=null, ttError="", ttBlobOut=null;
const te=new TextEncoder(), td=new TextDecoder();
function b64(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const unb64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const cryptoOK = () => !!(window.crypto&&crypto.subtle);
async function ttKey(pw,salt,iter){const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function ttEncrypt(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await ttKey(pw,salt,TT_ITER),te.encode(JSON.stringify(obj))));
  return {v:1,kdf:"PBKDF2-SHA256",iter:TT_ITER,cipher:"AES-256-GCM",salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function ttDecrypt(blob,pw){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(blob.iv)},await ttKey(pw,unb64(blob.salt),blob.iter),unb64(blob.ct));
  return cleanTimetable(JSON.parse(td.decode(pt)))}
function cleanTimetable(o){if(!isObj(o)||!Array.isArray(o.rows))throw new Error("shape");
  return {updated:str(o.updated,20)||"",notes:str(o.notes,4000)||"",rows:o.rows.slice(0,200).filter(isObj).map(r=>({when:str(r.when,200)||"",what:str(r.what,1000)||""})).filter(r=>r.when||r.what)}}
const rowsToText = rows => rows.map(r=>`${r.when} | ${r.what}`).join("\n");
const textToRows = t => t.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf("|");return i<0?{when:l,what:""}:{when:l.slice(0,i).trim(),what:l.slice(i+1).trim()}});
function renderTimetable(){
  const v=document.getElementById("v-time"),blob=D.timetable;
  const lock=!TT?(blob?`<form class="unlock" id="ttunlock"><label class="lbl" for="ttpw">Password</label>
      <div class="row"><input id="ttpw" type="password" autocomplete="current-password"><button class="btn primary" type="submit">Unlock</button></div>
      ${ttError?`<p class="err" role="alert">${esc(ttError)}</p>`:""}
      <p class="mini mt-xs">Decrypted in this tab only; nothing is sent or stored.</p></form>`
    :`<div class="note">No timetable is published yet. Create one below, save the file as <code>data/timetable.enc.json</code>, rebuild and commit.</div>`)
    :`<div class="box"><div class="boxhead"><h3>Weekly timetable</h3>${TT.updated?`<span class="mini">Updated <span class="mono">${esc(TT.updated)}</span></span>`:""}<button type="button" class="btn" id="ttlock">Lock</button></div>
      <table class="mt-xs"><colgroup><col style="width:38%"><col></colgroup><thead><tr><th>When</th><th>What</th></tr></thead><tbody>${TT.rows.map(r=>`<tr class="cl"><td><b>${esc(r.when)}</b></td><td>${esc(r.what)}</td></tr>`).join("")}</tbody></table>
      ${TT.notes?`<p class="mini mt-sm pre-wrap">${esc(TT.notes)}</p>`:""}</div>`;
  v.innerHTML=`<div><div class="phead"><div><h2>Timetable</h2><p class="lead">Your week, and whether you're behind. The timetable is published only as encrypted data (AES-256-GCM, key from your password with PBKDF2, ${TT_ITER.toLocaleString()} rounds). Anyone can download the ciphertext, so a weak password can be guessed offline; use a long one.</p></div></div>
   ${cryptoOK()?lock:`<div class="warn">This browser doesn't allow Web Crypto on this page (it needs https or a local file). Open the published site to unlock the timetable.</div>`}
   ${lateHTML()||`<div class="note mt-lg">Nothing is past its window. Lateness counts stages, projects and certs whose window ended with work not done; missed sessions never roll over.</div>`}
   ${cryptoOK()?`<details class="box mt-lg" ${ttBlobOut?"open":""}><summary>Create or replace the encrypted timetable</summary>
    <p class="mini mb-xs">One row per line: <code>when | what</code>. ${TT?"Prefilled from the unlocked timetable.":""}</p>
    <textarea id="ttrows" rows="8" aria-label="Timetable rows" placeholder="Mon 19:00 to 20:00 | Example: one course item&#10;Sat 10:00 to 12:00 | Example: project work">${TT?esc(rowsToText(TT.rows)):""}</textarea>
    <label class="lbl" for="ttnotes">Notes (optional)</label><textarea id="ttnotes" rows="2">${TT?esc(TT.notes):""}</textarea>
    <div class="evgrid mt-sm"><label>New password<input id="ttnew" type="password" autocomplete="new-password"></label><label>Repeat it<input id="ttnew2" type="password" autocomplete="new-password"></label></div>
    <p class="mini mt-xs mb-sm" id="ttstrength"></p>
    <button type="button" class="btn primary" id="ttenc">Encrypt</button>
    ${ttBlobOut?`<div class="mt-sm"><p class="mini mb-xs">Encrypted. Save it as <code>data/timetable.enc.json</code>, run <code>python3 tools/build.py</code>, then commit. The password is not in the file; don't lose it.</p>
      <textarea id="ttout" rows="4" readonly aria-label="Encrypted timetable">${esc(JSON.stringify(ttBlobOut))}</textarea><button type="button" class="btn mt-xs" id="ttdl">Download timetable.enc.json</button></div>`:""}
   </details>`:""}</div>`;
  const f=v.querySelector("#ttunlock");
  if(f)f.onsubmit=async e=>{e.preventDefault();const pw=v.querySelector("#ttpw").value;ttError="";
    try{TT=await ttDecrypt(blob,pw)}catch(_){TT=null;ttError="That password doesn't open this timetable."}renderTimetable();if(!TT)v.querySelector("#ttpw").focus()};
  const lk=v.querySelector("#ttlock");if(lk)lk.onclick=()=>{TT=null;ttBlobOut=null;renderTimetable()};
  const nw=v.querySelector("#ttnew"),strength=v.querySelector("#ttstrength");
  const judge=()=>{if(!nw)return;const n=nw.value.length;strength.textContent=!n?`Use at least ${TT_MIN_PW} characters; a few random words work well.`:n<TT_MIN_PW?`⚠ ${n} characters: short passwords can be guessed offline. ${TT_MIN_PW}+ recommended.`:`${n} characters.`;strength.classList.remove("badt");strength.classList.toggle("warnt",!!n&&n<TT_MIN_PW)};
  if(nw){nw.oninput=judge;judge();
    v.querySelector("#ttenc").onclick=async()=>{const p1=nw.value,p2=v.querySelector("#ttnew2").value;
      if(!p1){strength.textContent="Enter a password.";return}if(p1!==p2){strength.textContent="The two passwords don't match.";strength.classList.add("badt");return}
      const rows=textToRows(v.querySelector("#ttrows").value);if(!rows.length){strength.textContent="Add at least one row.";return}
      ttBlobOut=await ttEncrypt({kind:"timetable",v:1,updated:new Date().toISOString().slice(0,10),rows,notes:v.querySelector("#ttnotes").value},p1);renderTimetable()};}
  const dl=v.querySelector("#ttdl");if(dl)dl.onclick=()=>download(ttBlobOut,"timetable.enc.json");
}

/* ---------- search: one box in the top bar; an exact ID, "ID · name" from the list, or part of a name ---------- */
document.body.insertAdjacentHTML("beforeend",`<datalist id="complist">${D.comps.map(c=>`<option value="${esc(c.id)} · ${esc(c.name)}"></option>`).join("")}</datalist>`);
function findComp(q){q=(q||"").trim();if(!q)return null;const id=q.split(" · ")[0].trim();
  if(byId[id])return id;if(groupById[id])return id;const low=q.toLowerCase();
  const hit=D.comps.find(c=>c.id.toLowerCase()===low)||D.comps.find(c=>c.name.toLowerCase().includes(low))||D.comps.find(c=>c.id.toLowerCase().startsWith(low));
  return hit?hit.id:null}
const gsearch=document.getElementById("gsearch"),hsearch=document.getElementById("hsearch"),findbtn=document.getElementById("findbtn");
function runSearch(inp){const id=findComp(inp.value);inp.classList.toggle("nomatch",!id);inp.setAttribute("aria-invalid",String(!id));if(!id)return;
  inp.value="";inp.setAttribute("aria-invalid","false");hsearch.classList.remove("open");findbtn.setAttribute("aria-expanded","false");
  if(groupById[id]){if(curView!=="map")go("map");openGroup(id,{center:true})}else select(id,{center:!!GRAPHS[curView]})}
gsearch.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();runSearch(gsearch)}if(e.key==="Escape"&&hsearch.classList.contains("open")){hsearch.classList.remove("open");findbtn.setAttribute("aria-expanded","false");findbtn.focus()}});
gsearch.addEventListener("input",e=>{gsearch.classList.remove("nomatch");gsearch.removeAttribute("aria-invalid");
  if(e.inputType==="insertReplacementText"||(gsearch.value.includes(" · ")&&findComp(gsearch.value)))runSearch(gsearch)});
findbtn.addEventListener("click",()=>{const open=!hsearch.classList.contains("open");hsearch.classList.toggle("open",open);findbtn.setAttribute("aria-expanded",String(open));if(open)gsearch.focus()});

/* ---------- keyboard: Escape closes the drawer; "/" focuses search ---------- */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&panel.classList.contains("on")&&!dlg.open){e.preventDefault();closePanel()}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(e.key==="/"&&!typing&&!e.metaKey&&!e.ctrlKey){e.preventDefault();if(getComputedStyle(findbtn).display!=="none"){hsearch.classList.add("open");findbtn.setAttribute("aria-expanded","true")}gsearch.focus()}});

/* ---------- header + refresh ---------- */
function renderHeader(){const done=ALL.filter(i=>st(i)==="done").length,ip=ALL.filter(i=>st(i)==="ip").length;
  document.getElementById("ver").textContent="v"+D.version;document.getElementById("hpct").innerHTML=`<span class="num">${done}/${ALL.length}</span> done`;
  document.getElementById("hbar").outerHTML=barHTML(ALL).replace('class="bar"','class="bar" id="hbar"');
  document.getElementById("nsub-today").textContent=ip?`${ip} in progress`:"Start here";document.getElementById("nsub-roadmap").textContent=`${done}/${ALL.length} done`}
/* ---------- colour mode: auto (follows the OS), light or dark; kept in its own key, never in progress ---------- */
const MODE_KEY="ntidebi-mode",MODES=["auto","light","dark"],MODE_LABEL={auto:"Auto",light:"Light",dark:"Dark"};
function applyMode(m){if(m==="light"||m==="dark")document.documentElement.dataset.mode=m;else delete document.documentElement.dataset.mode;
  const b=document.getElementById("modebtn");b.textContent=MODE_LABEL[m];b.setAttribute("aria-label",`Colour mode: ${MODE_LABEL[m]}. Switch mode`)}
let curMode=(()=>{const m=readKey(MODE_KEY);return MODES.includes(m)?m:"auto"})();applyMode(curMode);
function setMode(m){curMode=m;if(m==="auto"){try{localStorage.removeItem(MODE_KEY)}catch(e){}}else writeKey(MODE_KEY,m);applyMode(m);if(curView==="route")requestAnimationFrame(drawRouteLines)}
document.getElementById("modebtn").addEventListener("click",()=>setMode(MODES[(MODES.indexOf(curMode)+1)%MODES.length]));
function refreshAll(){renderNotices();renderHeader();renderGraphState();if(!GRAPHS[curView])renderView(curView);if(selId&&panel.classList.contains("on"))openComp(selId)}

/* ---------- start ---------- */
document.getElementById("legend").innerHTML=LEGEND;if(!narrow())document.getElementById("legwrap").open=true;
renderHeader();renderNotices();
(()=>{const r=parseHash(location.hash);
  if(r&&r.comp){const grp=!!groupById[r.comp];showView(grp?"map":"today");lastViewHash="#"+viewHash();
    requestAnimationFrame(()=>{if(grp){GRAPHS.map.fit();openGroup(r.comp,{center:true})}else select(r.comp,{expand:true,focus:false})})}
  else{if(r&&r.filters)Object.assign(F,r.filters);if(r&&r.route)routeId=r.route;showView(r?r.view:"today");lastViewHash="#"+viewHash()}})();
if(syncOn())syncNow();
</script>
</body>
