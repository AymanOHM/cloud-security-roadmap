@font-face{font-family:"Host Grotesk";src:url("data:font/woff2;base64,__FONT_HOST_GROTESK__") format("woff2");font-weight:300 800;font-style:normal;font-display:swap}

/* ---------- tokens: light (Console paper) by default, dark (Console graphite) by mode or OS ---------- */
:root{
  color-scheme:light dark;
  --space-3xs:2px;--space-2xs:4px;--space-xs:8px;--space-sm:12px;--space-md:16px;--space-lg:24px;--space-xl:40px;--space-2xl:64px;--space-3xl:96px;
  --text-xs:0.75rem;--text-sm:0.875rem;--text-md:1rem;--text-lg:1.2rem;--text-xl:1.44rem;--text-2xl:1.728rem;--text-3xl:2.488rem;--text-reading:3.583rem;
  --ease-out:cubic-bezier(0.16,1,0.3,1);--ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --dur-micro:120ms;--dur-short:220ms;
  --container:1360px;--panel-w:440px;--ctl-h:34px;--tab-h:44px;
  --z-base:1;--z-raised:10;--z-sticky:200;--z-sticky-nav:300;--z-modal:400;
  --font-display:"Host Grotesk",ui-sans-serif,system-ui,sans-serif;--font-body:var(--font-display);
  --font-outlier:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius-card:10px;--radius-pill:6px;--radius-chip:4px;--rule-hair:1px;
  --tracking-display:-0.03em;--display-weight:500;

  --color-paper:oklch(97% 0.006 85);--color-paper-2:oklch(99.2% 0.004 85);--color-paper-3:oklch(94.5% 0.008 85);
  --color-ink:oklch(19% 0.010 60);--color-ink-2:oklch(32% 0.010 60);--color-muted:oklch(46% 0.012 60);
  --color-rule:oklch(88% 0.008 70);--color-rule-2:oklch(74% 0.010 70);
  --color-accent:oklch(52% 0.14 65);--color-accent-ink:oklch(99% 0.008 85);--color-accent-soft:oklch(93% 0.045 80);--color-accent-text:oklch(45% 0.12 65);--color-focus:oklch(54% 0.17 65);
  --color-cool:oklch(50% 0.14 250);--color-cool-soft:oklch(93% 0.03 245);
  --color-ok:oklch(50% 0.13 150);--color-ok-soft:oklch(94% 0.035 150);--color-bad:oklch(52% 0.18 25);--color-bad-soft:oklch(94% 0.03 25);
  --color-dots:oklch(87% 0.008 70);--color-scrim:oklch(19% 0.010 60 / 0.45);
}
:root[data-mode="dark"]{
  --color-paper:oklch(17% 0.008 250);--color-paper-2:oklch(21% 0.009 250);--color-paper-3:oklch(13.5% 0.007 250);
  --color-ink:oklch(95% 0.005 250);--color-ink-2:oklch(83% 0.008 250);--color-muted:oklch(71% 0.01 250);
  --color-rule:oklch(31% 0.01 250);--color-rule-2:oklch(42% 0.012 250);
  --color-accent:oklch(82% 0.15 80);--color-accent-ink:oklch(18% 0.04 75);--color-accent-soft:oklch(29% 0.05 80);--color-accent-text:oklch(84% 0.14 80);--color-focus:oklch(82% 0.15 80);
  --color-cool:oklch(77% 0.12 245);--color-cool-soft:oklch(29% 0.05 245);
  --color-ok:oklch(76% 0.15 150);--color-ok-soft:oklch(24.5% 0.03 150);--color-bad:oklch(70% 0.17 25);--color-bad-soft:oklch(24.5% 0.035 25);
  --color-dots:oklch(24% 0.009 250);--color-scrim:oklch(10% 0.007 250 / 0.6);
}
@media (prefers-color-scheme:dark){:root:not([data-mode]){
  --color-paper:oklch(17% 0.008 250);--color-paper-2:oklch(21% 0.009 250);--color-paper-3:oklch(13.5% 0.007 250);
  --color-ink:oklch(95% 0.005 250);--color-ink-2:oklch(83% 0.008 250);--color-muted:oklch(71% 0.01 250);
  --color-rule:oklch(31% 0.01 250);--color-rule-2:oklch(42% 0.012 250);
  --color-accent:oklch(82% 0.15 80);--color-accent-ink:oklch(18% 0.04 75);--color-accent-soft:oklch(29% 0.05 80);--color-accent-text:oklch(84% 0.14 80);--color-focus:oklch(82% 0.15 80);
  --color-cool:oklch(77% 0.12 245);--color-cool-soft:oklch(29% 0.05 245);

  --color-dots:oklch(24% 0.009 250);--color-scrim:oklch(10% 0.007 250 / 0.6);
}}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:clip;background:var(--color-paper);color:var(--color-ink)}
body{font-family:var(--font-body);font-size:var(--text-sm);line-height:1.5;font-synthesis:none;-webkit-font-smoothing:antialiased;caret-color:var(--color-accent)}
html{scrollbar-color:var(--color-rule-2) var(--color-paper)}
::selection{background:color-mix(in oklab,var(--color-accent) 25%,transparent)}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
button,select,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration-color:var(--color-rule-2);text-decoration-thickness:1px;text-underline-offset:0.16em}
a:hover{text-decoration-color:var(--color-accent)}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--tracking-display);line-height:1.1;overflow-wrap:break-word;min-width:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
code,.mono{font-family:var(--font-outlier);font-size:0.92em;font-variant-numeric:tabular-nums slashed-zero}
svg{display:block}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100dvh}

/* ---------- top bar ---------- */
header.top{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-lg);background:var(--color-paper-2);border-bottom:var(--rule-hair) solid var(--color-rule)}
header.top h1{font-size:var(--text-lg);letter-spacing:-0.02em;white-space:nowrap;max-width:none}
header.top .ver{color:var(--color-muted);font-family:var(--font-outlier);font-size:var(--text-xs)}
.hprog{display:flex;align-items:center;gap:var(--space-sm);margin-left:auto;color:var(--color-ink-2)}
.hprog #hpct{font-family:var(--font-outlier);font-size:var(--text-sm);font-variant-numeric:tabular-nums slashed-zero;white-space:nowrap}
.modebtn{min-width:5.5rem}

/* ---------- tabs ---------- */
nav#tabs{display:flex;gap:var(--space-3xs);padding:0 var(--space-md);border-bottom:var(--rule-hair) solid var(--color-rule);background:var(--color-paper-2);overflow-x:auto;scrollbar-width:none}
nav#tabs button{position:relative;height:var(--tab-h);background:none;border:0;padding:0 var(--space-sm);color:var(--color-muted);cursor:pointer;white-space:nowrap;font-weight:500;transition:color var(--dur-micro) var(--ease-out)}
nav#tabs button::after{content:"";position:absolute;left:var(--space-sm);right:var(--space-sm);bottom:0;height:2px;background:var(--color-accent);transform:scaleX(0);transition:transform var(--dur-short) var(--ease-out)}
nav#tabs button:hover{color:var(--color-ink)}
nav#tabs button:active{color:var(--color-ink-2)}
nav#tabs button.on{color:var(--color-ink)}
nav#tabs button.on::after{transform:scaleX(1)}
nav#tabs button:focus-visible{outline-offset:-2px}

main{flex:1;display:flex;min-height:0;position:relative}
.view{flex:1;min-width:0;overflow:auto;display:none}
.view.on{display:block}
.gview.on{display:flex;flex-direction:column;overflow:hidden}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs);min-height:var(--ctl-h);background:var(--color-paper-2);border:var(--rule-hair) solid var(--color-rule-2);border-radius:var(--radius-pill);padding:0 var(--space-sm);cursor:pointer;color:var(--color-ink);font-weight:500;white-space:nowrap;transition:background-color var(--dur-micro) var(--ease-out),border-color var(--dur-micro) var(--ease-out)}
.btn:hover{border-color:var(--color-muted);background:var(--color-paper-3)}
.btn:active{background:var(--color-rule)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:0.55;cursor:not-allowed}
.btn.on,.btn[aria-pressed="true"]{border-color:var(--color-accent);background:var(--color-accent-soft);color:var(--color-ink)}
.btn.primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink)}
.btn.primary:hover{background:color-mix(in oklab,var(--color-accent) 88%,var(--color-ink))}
.btn.danger{color:var(--color-bad);border-color:color-mix(in oklab,var(--color-bad) 50%,var(--color-rule-2))}
.btn.danger:hover{background:var(--color-bad-soft)}
.btn.icon{width:var(--ctl-h);padding:0}
select.btn{padding:0 var(--space-xs) 0 var(--space-sm)}
input.field,.filters input,.gsearch,textarea,.evgrid input,.evgrid select,#ttpw{min-height:var(--ctl-h);background:var(--color-paper-3);border:var(--rule-hair) solid var(--color-rule-2);border-radius:var(--radius-pill);padding:0 var(--space-sm);color:var(--color-ink)}
input::placeholder,textarea::placeholder{color:var(--color-muted)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:-1px}
input:disabled,select:disabled,textarea:disabled{opacity:0.55;cursor:not-allowed}
textarea{display:block;width:100%;min-height:76px;padding:var(--space-xs) var(--space-sm);resize:vertical;line-height:1.5}
.gsearch{width:240px;max-width:100%}
.gsearch.nomatch{border-color:var(--color-bad)}

/* ---------- toolbars and legend (graph views) ---------- */
.toolbar{display:flex;gap:var(--space-xs);align-items:center;padding:var(--space-xs) var(--space-md);border-bottom:var(--rule-hair) solid var(--color-rule);flex-wrap:wrap;background:var(--color-paper)}
.legwrap{display:contents}
.legwrap>summary{display:none}
.legend{display:flex;gap:var(--space-md);flex-wrap:wrap;color:var(--color-muted);font-size:var(--text-xs);align-items:center;margin-left:auto}
.legend>span{display:inline-flex;align-items:center;gap:var(--space-2xs)}
.lg-line{display:inline-block;width:18px;height:2px}
.lg-needs{background:var(--color-cool)}
.lg-unlocks{background:var(--color-accent)}
.lg-box{display:inline-block;width:14px;height:10px;border:var(--rule-hair) solid var(--color-rule-2);border-radius:2px}
.lg-box.dash{border-style:dashed}
.lg-box.stack{box-shadow:3px -3px 0 -1px var(--color-paper),3px -3px 0 0 var(--color-rule-2)}

/* status glyphs: ring = ready, half = in progress, filled = completed, lock = locked */
.sg{display:inline-flex;flex-shrink:0;width:12px;height:12px;color:var(--color-ink-2)}
.sg svg{width:12px;height:12px}
.sg-ip{color:var(--color-accent)}
.sg-done{color:var(--color-ok)}
.sg-locked{color:var(--color-muted)}

/* ---------- canvas and graph ---------- */
.canvas{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(circle,var(--color-dots) 1px,transparent 1px) 0 0/24px 24px}
.canvas.drag{cursor:grabbing}
.canvas svg{position:absolute;inset:0;width:100%;height:100%;user-select:none;font-family:var(--font-body)}
.node{cursor:pointer}
.node:focus{outline:none}
.node .box{fill:var(--color-paper-2);stroke:var(--color-rule-2);stroke-width:1}
.node:hover .box{stroke:var(--color-muted)}
.node.st-ip .box{fill:var(--color-accent-soft);stroke:var(--color-accent)}
.node.st-done .box{fill:var(--color-ok-soft);stroke:var(--color-ok)}
.node.exist .box{stroke-dasharray:5 3}
.node .under{fill:var(--color-paper-3);stroke:var(--color-rule-2)}
.node.sel .box{stroke:var(--color-ink);stroke-width:2.5}
.node:focus-visible .box{stroke:var(--color-focus);stroke-width:3}
.node.stagehd:focus-visible text{text-decoration:underline}
.node.dim{opacity:0.22}
.node.blk .nt{fill:var(--color-ink-2)}
.nt{fill:var(--color-ink);font-weight:500}
.nsub,.nex{fill:var(--color-muted)}
.nid{fill:var(--color-muted);font-family:var(--font-outlier)}
.ndot{fill:none;stroke:var(--color-ink-2);stroke-width:1.5}
.st-ip .ndot{fill:var(--color-accent);stroke:var(--color-accent)}
.st-done .ndot{fill:var(--color-ok);stroke:var(--color-ok)}
.nlock{color:var(--color-muted)}
.edge{fill:none;stroke:var(--color-rule-2);stroke-width:1.2;opacity:0}
.edges-all .edge{opacity:0.45}
.edge.flow{opacity:0.6}
.has-sel .edge.flow{opacity:0.14}
.edge.in{stroke:var(--color-cool);opacity:1;stroke-width:2}
.edge.out{stroke:var(--color-accent);opacity:1;stroke-width:2}
.has-sel .edge.in,.has-sel .edge.out{opacity:1}
.has-sel.chain .edge.flow,.chain .edge.off{opacity:0.04}
.arrowhead{fill:var(--color-muted)}
.colh{fill:var(--color-ink);font-weight:500}
.colsub{fill:var(--color-muted)}
.bandrule{stroke:var(--color-rule-2);stroke-dasharray:4 4}
.stcol{fill:var(--color-paper);stroke:var(--color-rule)}
.stcol.alt{fill:var(--color-paper-3)}
.laneline{stroke:var(--color-rule)}
.gate{fill:var(--color-ink);stroke:var(--color-paper);stroke-width:2}
.sbtrack{fill:var(--color-rule)}
.sbdone{fill:var(--color-ok)}
.sbip{fill:var(--color-accent)}
.sbnum{fill:var(--color-muted);font-family:var(--font-outlier)}
.zoombox{position:absolute;right:var(--space-sm);bottom:var(--space-sm);display:flex;flex-direction:column;gap:var(--space-2xs);z-index:var(--z-raised)}
.zoombox .btn{width:var(--ctl-h);padding:0}

/* ---------- bars ---------- */
.bar{height:6px;background:var(--color-rule);border-radius:3px;overflow:hidden;display:flex;min-width:80px;width:100%;flex:none}
.stagehead .bar{flex:1;width:auto}
.bar span{display:block;height:100%}
.bar .b-done{background:var(--color-ok)}
.bar .b-ip{background:var(--color-accent)}
.bar .b-cool{background:var(--color-cool)}
.bar.fixed{flex:none}
.hprog .bar{width:160px}
header.top h1{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ---------- side panel: header pinned by layout, body scrolls ---------- */
#panel{width:var(--panel-w);max-width:100%;border-left:var(--rule-hair) solid var(--color-rule);background:var(--color-paper-2);color:var(--color-ink);display:none;flex-direction:column;flex-shrink:0;min-height:0}
#panel.on{display:flex}
#panel .ph{flex-shrink:0;border-bottom:var(--rule-hair) solid var(--color-rule);padding:var(--space-md) var(--space-lg);display:flex;gap:var(--space-sm);align-items:flex-start}
#panel .ph h2{font-size:var(--text-xl);line-height:1.15;margin-top:var(--space-2xs)}
#panel .pid{font-family:var(--font-outlier);font-size:var(--text-sm);color:var(--color-muted);font-variant-numeric:slashed-zero}
#panel .close{margin-left:auto;flex-shrink:0}
#panel .pb{flex:1;overflow:auto;padding:var(--space-md) var(--space-lg) var(--space-2xl)}
.sec{margin:var(--space-lg) 0 0}
.sec:first-child{margin-top:0}
.sec h3{font-size:var(--text-sm);letter-spacing:0;color:var(--color-muted);margin:0 0 var(--space-xs);font-weight:500;max-width:none}
.sec p,.sec li{font-size:var(--text-md);line-height:1.55;color:var(--color-ink-2);max-width:65ch}
.sec ul,.sec ol{margin:0;padding-left:var(--space-lg)}
.sec li+li{margin-top:var(--space-2xs)}
.badges{display:flex;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-sm)}
.badge,.srcb{display:inline-flex;align-items:center;gap:var(--space-2xs);font-size:var(--text-xs);font-weight:500;padding:var(--space-3xs) var(--space-xs);border-radius:var(--radius-chip);border:var(--rule-hair) solid var(--color-rule-2);color:var(--color-ink-2);white-space:nowrap;line-height:1.4}
.badge.noev,.badge.ip{background:var(--color-accent-soft);border-color:var(--color-accent);color:var(--color-ink)}
.badge.late,.badge.bad{background:var(--color-bad-soft);border-color:var(--color-bad);color:var(--color-ink)}
.badge.ok{background:var(--color-ok-soft);border-color:var(--color-ok);color:var(--color-ink)}
.badge.rec{background:var(--color-ok-soft);border-color:var(--color-ok);color:var(--color-ink)}
.badge .mono{font-size:inherit}
.statusset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:var(--rule-hair) solid var(--color-rule-2);border-radius:var(--radius-pill);overflow:hidden}
.statusset button{min-height:40px;border:0;background:var(--color-paper-2);cursor:pointer;font-weight:500;color:var(--color-ink-2);transition:background-color var(--dur-micro) var(--ease-out)}
.statusset button+button{border-left:var(--rule-hair) solid var(--color-rule-2)}
.statusset button:hover{background:var(--color-paper-3);color:var(--color-ink)}
.statusset button:active{background:var(--color-rule)}
.statusset button:focus-visible{outline-offset:-3px}
.statusset button.on[data-s="ns"]{background:var(--color-paper-3);color:var(--color-ink)}
.statusset button.on[data-s="ip"]{background:var(--color-accent);color:var(--color-accent-ink)}
.statusset button.on[data-s="done"]{background:var(--color-ok);color:var(--color-paper-2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2xs) var(--space-xs)}
.chip{display:inline-flex;align-items:center;gap:var(--space-xs);font-size:var(--text-sm);min-height:30px;padding:0 var(--space-sm) 0 var(--space-xs);border-radius:var(--radius-pill);border:var(--rule-hair) solid var(--color-rule);background:var(--color-paper-2);color:var(--color-ink);cursor:pointer;text-align:left;transition:border-color var(--dur-micro) var(--ease-out)}
.chip:hover{border-color:var(--color-muted)}
.chip:active{background:var(--color-paper-3)}
.chip .cid{font-family:var(--font-outlier);font-size:var(--text-xs);color:var(--color-muted)}
.warn,.blockmsg,.note{border-radius:var(--radius-pill);padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);color:var(--color-ink);line-height:1.5}
.warn{background:var(--color-accent-soft);color:var(--color-ink)}
.warn+.evgrid{margin-top:var(--space-sm)}
.blockmsg{background:var(--color-bad-soft);color:var(--color-ink)}
.note{background:var(--color-paper-3);color:var(--color-ink)}
.blockmsg .chips{margin-top:var(--space-xs)}
.unk{color:var(--color-muted)}
.warnt{color:var(--color-accent-text)}
.badt{color:var(--color-bad)}
.mini{font-size:var(--text-xs);color:var(--color-muted)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mt-xs{margin-top:var(--space-xs)}
.mt-sm{margin-top:var(--space-sm)}
.mt-lg{margin-top:var(--space-lg)}
.mb-xs{margin-bottom:var(--space-xs)}
.mb-sm{margin-bottom:var(--space-sm)}
.mb-lg{margin-bottom:var(--space-lg)}

/* ---------- pages ---------- */
.page{padding:var(--space-xl) var(--space-xl) var(--space-3xl);max-width:var(--container);margin-inline:auto}
.page.wide{max-width:none}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-sm) var(--space-xl);margin-bottom:var(--space-lg)}
.phead h2{font-size:var(--text-2xl);max-width:24ch}
.page .lead{color:var(--color-muted);font-size:var(--text-md);max-width:68ch;margin-top:var(--space-xs)}
.page h3.sub{font-size:var(--text-lg);margin:var(--space-2xl) 0 var(--space-xs)}
table{border-collapse:collapse;width:100%;font-size:var(--text-sm)}
th,td{border-bottom:var(--rule-hair) solid var(--color-rule);padding:var(--space-sm) var(--space-xs);text-align:left;vertical-align:top}
th{color:var(--color-muted);font-weight:500;font-size:var(--text-xs);white-space:nowrap;border-bottom-color:var(--color-rule-2)}
td:first-child,th:first-child{padding-left:0}
td:last-child,th:last-child{padding-right:0}
tr.cl:hover td{background:var(--color-paper-3)}
td.idc a{font-family:var(--font-outlier);font-weight:500;text-decoration:none;color:var(--color-ink)}
td.idc a:hover{color:var(--color-accent-text);text-decoration:underline}
td.pre{font-family:var(--font-outlier);font-size:var(--text-xs);color:var(--color-muted)}
td.pre .ok{color:var(--color-ok)}
td.num,.num{font-family:var(--font-outlier);font-variant-numeric:tabular-nums slashed-zero}
.filters{display:flex;gap:var(--space-xs);flex-wrap:wrap;align-items:center;margin-bottom:var(--space-lg)}
.filters input{min-width:200px}
.filters .count{margin-left:auto}
.stagehead{display:flex;align-items:center;gap:var(--space-md);margin:var(--space-xl) 0 var(--space-xs)}
.stagehead h3{font-size:var(--text-lg);white-space:nowrap}
.stagehead .bar{max-width:180px}
.panels{display:grid;gap:var(--rule-hair);background:var(--color-rule);color:var(--color-ink);border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-card);overflow:hidden}
.panels>*{background:var(--color-paper-2);color:var(--color-ink);padding:var(--space-lg);min-width:0}
.panels h3{font-size:var(--text-md);margin-bottom:var(--space-sm);max-width:none}
.p2{grid-template-columns:repeat(2,minmax(0,1fr))}
.p3{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2}
.rowbar{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 7rem;gap:var(--space-sm);align-items:center;padding:var(--space-xs) 0;border-top:var(--rule-hair) solid var(--color-rule)}
.rowbar:first-of-type{border-top:0}
.rowbar .num{font-size:var(--text-xs);color:var(--color-muted);text-align:right}
button.rowbar{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
button.rowbar:hover span:first-child{color:var(--color-accent-text)}
.scrolllist{max-height:280px;overflow:auto}
.waitrow{display:flex;gap:var(--space-xs);font-size:var(--text-xs);padding:var(--space-2xs) 0;color:var(--color-muted)}
.waitrow b{font-family:var(--font-outlier);font-weight:500;color:var(--color-ink)}
.waitrow .mono{color:var(--color-muted)}

/* dashboard: one reading set large, then the figures that compare */
.reading{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-sm) var(--space-2xl);align-items:end;padding-bottom:var(--space-xl);border-bottom:var(--rule-hair) solid var(--color-rule);margin-bottom:var(--space-xl)}
.reading .big{font-family:var(--font-outlier);font-size:var(--text-reading);line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums slashed-zero}
.reading .big small{font-size:0.45em;color:var(--color-muted);letter-spacing:-0.02em}
.reading .cap{color:var(--color-muted);margin-top:var(--space-xs);font-size:var(--text-sm)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stats>div{padding:0 var(--space-lg);border-left:var(--rule-hair) solid var(--color-rule)}
.stats>div:first-child{padding-left:0;border-left:0}
.stats .v{font-family:var(--font-outlier);font-size:var(--text-2xl);line-height:1.1;font-variant-numeric:tabular-nums slashed-zero}
.stats .v.ip{color:var(--color-accent-text)}
.stats .v.warnv{color:var(--color-bad)}
.stats .l{color:var(--color-muted);font-size:var(--text-xs);margin-top:var(--space-2xs);line-height:1.35}
.nextlist{list-style:none;margin:0;padding:0}
.nextlist li{border-top:var(--rule-hair) solid var(--color-rule)}
.nextlist li:first-child{border-top:0}
.nextlist button{display:grid;grid-template-columns:16px 5.5rem minmax(0,1fr) auto;gap:var(--space-sm);align-items:center;width:100%;min-height:40px;padding:var(--space-xs) 0;background:none;border:0;color:var(--color-ink);text-align:left;cursor:pointer;font-size:var(--text-sm)}
.nextlist button:hover .nn{color:var(--color-accent-text)}
.nextlist .ni{font-family:var(--font-outlier);font-size:var(--text-xs);color:var(--color-muted)}
.nextlist .nm{font-size:var(--text-xs);color:var(--color-muted);white-space:nowrap}
.radar{width:100%;max-width:460px;margin:var(--space-xs) auto 0}
.radar .rgrid{fill:none;stroke:var(--color-rule)}
.radar .rlab{fill:var(--color-muted);font-size:11px}
.radar .rstart{fill:none;stroke:var(--color-accent);stroke-dasharray:4 3}
.radar .rdone{fill:var(--color-ok);fill-opacity:0.22;stroke:var(--color-ok);stroke-width:1.5}
.databand{display:flex;flex-wrap:wrap;gap:var(--space-xs);align-items:center}
.filebtn input{display:none}

/* kanban: columns are a head and a list, the cards are the only boxes */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:var(--space-lg);overflow-x:auto;align-items:start}
.kcol{display:flex;flex-direction:column;min-height:200px;max-height:calc(100dvh - 300px);border-radius:var(--radius-card);outline:2px dashed transparent;outline-offset:var(--space-2xs)}
.kcol.over{outline-color:var(--color-accent)}
.kcol.nodrop{outline-color:var(--color-bad);cursor:not-allowed}
.khead{display:flex;align-items:baseline;gap:var(--space-xs);padding-bottom:var(--space-sm);border-bottom:2px solid var(--color-rule-2);margin-bottom:var(--space-sm);flex-wrap:wrap}
.kcol[data-col="ip"] .khead{border-bottom-color:var(--color-accent)}
.kcol[data-col="done"] .khead{border-bottom-color:var(--color-ok)}
.khead b{font-size:var(--text-md);font-weight:500}
.khead .num{color:var(--color-muted);font-size:var(--text-sm)}
.khead .mini{width:100%}
.kbody{overflow:auto;display:flex;flex-direction:column;gap:var(--space-xs);padding:var(--space-3xs)}
.kcard{background:var(--color-paper-2);color:var(--color-ink);border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-pill);padding:var(--space-sm);cursor:grab;transition:border-color var(--dur-micro) var(--ease-out)}
.kcard:hover{border-color:var(--color-muted)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:0.4}
.kname{font-weight:500;font-size:var(--text-sm);margin-bottom:var(--space-xs);line-height:1.35}
.kmeta{display:flex;gap:var(--space-xs);align-items:center;flex-wrap:wrap;font-size:var(--text-xs);color:var(--color-muted)}
.kmeta .cid{font-family:var(--font-outlier)}
.knote{font-size:var(--text-xs);color:var(--color-muted);margin-top:var(--space-xs);line-height:1.4}
.knote.ip,.knote.noev{color:var(--color-accent-text)}
.kempty{font-size:var(--text-xs);color:var(--color-muted);padding:var(--space-xs) 0}

/* paths */
.trail{display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap;margin:0 0 var(--space-lg)}
.trail .seg{padding:var(--space-xs) var(--space-sm);border:var(--rule-hair) solid var(--color-rule-2);border-radius:var(--radius-pill);background:var(--color-paper-2)}
.trail .seg.decide{border-color:var(--color-accent);background:var(--color-accent-soft)}
.trail .sep{width:24px;height:1px;background:var(--color-rule-2)}
.pathpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:var(--rule-hair);background:var(--color-rule);border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-card);overflow:hidden}
.pathcard{display:flex;flex-direction:column;gap:var(--space-xs);padding:var(--space-md);background:var(--color-paper-2);border:0;text-align:left;cursor:pointer;color:var(--color-ink);transition:background-color var(--dur-micro) var(--ease-out)}
.pathcard:hover{background:var(--color-paper-3)}
.pathcard:focus-visible{outline-offset:-3px}
.pathcard.on{background:var(--color-accent-soft);color:var(--color-ink)}
.pathcard .pt{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-xs);font-weight:500;font-size:var(--text-md)}
.pathcard p{flex:1}
.pathcard p{font-size:var(--text-xs);color:var(--color-ink-2);line-height:1.45}
.specrow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs);padding:var(--space-2xs) 0}

/* compare */
.hours .rowbar{grid-template-columns:minmax(0,14rem) minmax(0,1fr) 4rem}

/* projects: a trail on a spine */
.ptrail{list-style:none;margin:0;padding:0;position:relative}
.ptrail::before{content:"";position:absolute;left:5px;top:var(--space-sm);bottom:var(--space-sm);width:1px;background:var(--color-rule-2)}
.ptrail>li{position:relative;padding:0 0 var(--space-2xl) var(--space-xl)}
.ptrail>li::before{content:"";position:absolute;left:0;top:var(--space-xs);width:11px;height:11px;border-radius:50%;background:var(--color-paper);border:2px solid var(--color-rule-2)}
.ptrail>li.pdone::before{background:var(--color-ok);border-color:var(--color-ok)}
.ptrail>li.pip::before{background:var(--color-accent);border-color:var(--color-accent)}
.ptitle{display:flex;align-items:baseline;gap:var(--space-sm);flex-wrap:wrap}
.ptitle .pid{font-family:var(--font-outlier);color:var(--color-muted);font-size:var(--text-md)}
.ptitle h3{font-size:var(--text-xl);max-width:none}
.pmeta{display:flex;flex-wrap:wrap;gap:var(--space-xs);align-items:center;margin:var(--space-sm) 0}
.pmeta .pct{margin-left:auto}
.pbody{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--space-xl);margin-top:var(--space-md)}
.pbody dl{margin:0;display:grid;gap:var(--space-sm)}
.pbody dt{font-weight:500;font-size:var(--text-sm)}
.pbody dd{margin:0;color:var(--color-ink-2);font-size:var(--text-sm);line-height:1.55}
.pbody ol{margin:var(--space-2xs) 0 var(--space-md);padding-left:var(--space-lg);color:var(--color-ink-2)}
.pbody h4{margin:0;font-size:var(--text-sm);font-weight:500}
.builds{font-size:var(--text-xs);color:var(--color-muted);margin-top:var(--space-2xs)}

/* certs timeline */
.tl{border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-card);background:var(--color-paper-2);padding:var(--space-md) var(--space-lg)}
.tlgrid{display:grid;grid-template-columns:170px minmax(0,1fr)}
.tlrow{display:contents}
.tllab{padding:var(--space-sm) var(--space-xs) var(--space-sm) 0;border-top:var(--rule-hair) solid var(--color-rule);font-size:var(--text-sm)}
.tllab b{font-family:var(--font-outlier);font-weight:500}
.tltrack{position:relative;border-top:var(--rule-hair) solid var(--color-rule);min-height:52px}
.tlbar{position:absolute;top:var(--space-sm);height:26px;border-radius:var(--radius-chip);font-size:var(--text-xs);padding:var(--space-2xs) var(--space-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:var(--rule-hair) solid var(--color-rule-2);background:var(--color-paper-3);color:var(--color-ink)}
.tlbar.v-ok{border-color:var(--color-ok);background:var(--color-ok-soft)}
.tlbar.v-bad{border-color:var(--color-bad);background:var(--color-bad-soft)}
.tlbar.v-mid{border-color:var(--color-cool);background:var(--color-cool-soft)}
.verdict.v-ok{color:var(--color-ok)}
.verdict.v-bad{color:var(--color-bad)}
.tlmonths{display:flex;font-size:var(--text-xs);color:var(--color-muted);font-family:var(--font-outlier);padding-bottom:var(--space-xs)}
.tlmonths div{flex:1;min-width:0;border-left:var(--rule-hair) solid var(--color-rule);padding-left:var(--space-2xs);white-space:nowrap;overflow:hidden}
.today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--color-accent)}
.readcell{display:flex;align-items:center;gap:var(--space-xs);min-width:130px}

/* timetable */
.unlock{max-width:520px;border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-card);background:var(--color-paper-2);padding:var(--space-lg)}
.unlock .row{display:flex;gap:var(--space-xs);margin-top:var(--space-2xs)}
.unlock .row input{flex:1}
.err{color:var(--color-bad);font-size:var(--text-sm);margin-top:var(--space-xs)}
.box{border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-card);background:var(--color-paper-2);padding:var(--space-lg)}
details.box>summary{cursor:pointer;font-weight:500}
details.box[open]>summary{margin-bottom:var(--space-sm)}
.boxhead{display:flex;gap:var(--space-sm);align-items:baseline;flex-wrap:wrap}
.boxhead h3{font-size:var(--text-md);max-width:none}
.boxhead .btn{margin-left:auto}
.pre-wrap{white-space:pre-wrap}

/* notices: one band under the tabs */
#notice:empty{display:none}
#notice{border-bottom:var(--rule-hair) solid var(--color-rule);background:var(--color-paper-3)}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);padding:var(--space-sm) var(--space-lg);font-size:var(--text-sm);color:var(--color-ink)}
.notice>b{font-weight:600}
.notice .acts{display:flex;gap:var(--space-xs);margin-left:auto}
.notice+.notice{border-top:var(--rule-hair) solid var(--color-rule)}
.notice .details{width:100%;font-size:var(--text-xs);color:var(--color-muted)}

/* dialog */
dialog#dlg{background:var(--color-paper-2);color:var(--color-ink);border:var(--rule-hair) solid var(--color-rule-2);border-radius:var(--radius-card);max-width:min(760px,94vw);padding:var(--space-lg)}
dialog#dlg::backdrop{background:var(--color-scrim)}
dialog#dlg h2{margin:0 0 var(--space-xs);font-size:var(--text-xl)}
dialog#dlg p{margin:var(--space-xs) 0;max-width:65ch}
.dlgscroll{max-height:40vh;overflow:auto;margin:var(--space-sm) 0;border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-pill);padding:0 var(--space-sm)}
.dlgact{display:flex;gap:var(--space-xs);justify-content:flex-end;margin-top:var(--space-lg)}
.evgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-sm)}
.evgrid label{display:flex;flex-direction:column;gap:var(--space-2xs);font-size:var(--text-xs);color:var(--color-muted)}
.evgrid .wide{grid-column:1/-1}
.lbl{display:block;font-size:var(--text-xs);color:var(--color-muted);margin:var(--space-sm) 0 var(--space-2xs)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0.01ms!important;animation-duration:0.01ms!important;scroll-behavior:auto!important}}
@media (max-width:1100px){.p3{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:auto}}
@media (max-width:900px){
  #panel{position:absolute;inset:0;width:100%;z-index:var(--z-sticky)}
  header.top .ver{display:none}
  .pbody{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:var(--space-lg)}
  .stats>div:nth-child(3){padding-left:0;border-left:0}
}
/* phones (A-17): toolbar and legend fold away, Kanban stacks, the checklist becomes rows of blocks, tables scroll inside themselves */
@media (max-width:700px){
  header.top{padding:var(--space-xs) var(--space-md);gap:var(--space-xs)}
  header.top h1{font-size:var(--text-md)}
  .hprog .bar{display:none}
  .hprog #hpct{font-size:var(--text-xs)}
  .modebtn{min-width:0}
  .toolbar{padding:var(--space-xs);gap:var(--space-2xs)}
  .gsearch{width:100%;order:-1}
  .legwrap{display:block;width:100%}
  .legwrap>summary{display:inline-flex;list-style:none}
  .legwrap .legend{margin:var(--space-xs) 0 0}
  .page{padding:var(--space-lg) var(--space-md) var(--space-3xl)}
  .phead h2{font-size:var(--text-xl)}
  .kanban{grid-template-columns:minmax(0,1fr)}
  .kcol{max-height:none}
  .p2,.p3{grid-template-columns:minmax(0,1fr)}
  .reading{grid-template-columns:minmax(0,1fr)}
  .rowbar{grid-template-columns:minmax(0,1fr) 4.5rem}
  .rowbar .bar{grid-column:1/-1;grid-row:2}
  .page table{display:block;overflow-x:auto}
  #v-checklist table{display:block;overflow:visible}
  #v-checklist thead{display:none}
  #v-checklist tbody{display:block}
  #v-checklist tr.cl{display:flex;flex-wrap:wrap;gap:var(--space-2xs) var(--space-sm);align-items:center;border-bottom:var(--rule-hair) solid var(--color-rule);padding:var(--space-sm) 0}
  #v-checklist td{border:0;padding:0}
  #v-checklist td:nth-child(3){order:-1;flex-basis:100%;font-weight:500;font-size:var(--text-md)}
  #v-checklist td:nth-child(6){flex-basis:100%}
  .tlgrid{grid-template-columns:96px minmax(0,1fr)}
  .tl{padding:var(--space-sm)}
  .notice{padding:var(--space-sm) var(--space-md)}
  .notice .acts{margin-left:0}
  .evgrid{grid-template-columns:minmax(0,1fr)}
  .nextlist button{grid-template-columns:16px 4.5rem minmax(0,1fr)}
  .nextlist .nm{grid-column:3}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <h1>NTI + DEBI Unified Roadmap</h1><span class="ver" id="ver"></span>
  <div class="hprog"><span id="hpct"></span><div class="bar" id="hbar"></div></div>
  <button type="button" class="btn modebtn" id="modebtn" aria-label="Colour mode">Auto</button>
</header>
<nav id="tabs" role="tablist" aria-label="Views">
  <button role="tab" id="tab-flow" aria-controls="v-flow" aria-selected="true" data-v="flow" class="on">Flowchart</button>
  <button role="tab" id="tab-roadmap" aria-controls="v-roadmap" aria-selected="false" tabindex="-1" data-v="roadmap">Stage map</button>
  <button role="tab" id="tab-kanban" aria-controls="v-kanban" aria-selected="false" tabindex="-1" data-v="kanban">Kanban</button>
  <button role="tab" id="tab-checklist" aria-controls="v-checklist" aria-selected="false" tabindex="-1" data-v="checklist">Checklist</button>
  <button role="tab" id="tab-paths" aria-controls="v-paths" aria-selected="false" tabindex="-1" data-v="paths">Career paths</button>
  <button role="tab" id="tab-compare" aria-controls="v-compare" aria-selected="false" tabindex="-1" data-v="compare">NTI vs DEBI</button>
  <button role="tab" id="tab-projects" aria-controls="v-projects" aria-selected="false" tabindex="-1" data-v="projects">Projects</button>
  <button role="tab" id="tab-certs" aria-controls="v-certs" aria-selected="false" tabindex="-1" data-v="certs">Certifications</button>
  <button role="tab" id="tab-time" aria-controls="v-time" aria-selected="false" tabindex="-1" data-v="time">Timetable</button>
  <button role="tab" id="tab-dash" aria-controls="v-dash" aria-selected="false" tabindex="-1" data-v="dash">Dashboard</button>
</nav>
<div id="notice" role="status"></div>
<main>
  <section class="view gview on" id="v-flow" role="tabpanel" aria-labelledby="tab-flow">
    <div class="toolbar gtool"></div>
    <div class="canvas" id="cv-flow">
      <svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prerequisite flowchart"><g class="vp"></g></svg>
      <div class="zoombox"><button type="button" class="btn zin" title="Zoom in" aria-label="Zoom in">+</button><button type="button" class="btn zout" title="Zoom out" aria-label="Zoom out">−</button><button type="button" class="btn zfit" title="Toggle: whole map / fit width" aria-label="Toggle whole map or fit width">⤢</button></div>
    </div>
  </section>
  <section class="view gview" id="v-roadmap" role="tabpanel" aria-labelledby="tab-roadmap">
    <div class="toolbar gtool" data-edges="1"></div>
    <div class="canvas" id="cv-roadmap">
      <svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stage map"><g class="vp"></g></svg>
      <div class="zoombox"><button type="button" class="btn zin" title="Zoom in" aria-label="Zoom in">+</button><button type="button" class="btn zout" title="Zoom out" aria-label="Zoom out">−</button><button type="button" class="btn zfit" title="Toggle: whole map / fit width" aria-label="Toggle whole map or fit width">⤢</button></div>
    </div>
  </section>
  <section class="view" id="v-kanban" role="tabpanel" aria-labelledby="tab-kanban"></section>
  <section class="view" id="v-checklist" role="tabpanel" aria-labelledby="tab-checklist"></section>
  <section class="view" id="v-paths" role="tabpanel" aria-labelledby="tab-paths"></section>
  <section class="view" id="v-compare" role="tabpanel" aria-labelledby="tab-compare"></section>
  <section class="view" id="v-projects" role="tabpanel" aria-labelledby="tab-projects"></section>
  <section class="view" id="v-certs" role="tabpanel" aria-labelledby="tab-certs"></section>
  <section class="view" id="v-time" role="tabpanel" aria-labelledby="tab-time"></section>
  <section class="view" id="v-dash" role="tabpanel" aria-labelledby="tab-dash"></section>
  <aside id="panel" aria-label="Details"></aside>
</main>
</div>
<dialog id="dlg" aria-label="Import"></dialog>
<script>
"use strict";
const D = /*DATA*/null;
const KEY = "ntidebi-roadmap-v1";
const SRC_LABEL = {NTI:"NTI",DEBI:"DEBI",IND:"Independent",SHARED:"Shared",EXIST:"Existing"};
const ST_LABEL = {ns:"Not started",ip:"In progress",done:"Completed"};
const PRI = {H:"High",M:"Medium",L:"Low"};
const byId = Object.fromEntries(D.comps.map(c=>[c.id,c]));
const stageById = Object.fromEntries(D.stages.map(s=>[s.id,s]));
const pathById = Object.fromEntries(D.paths.map(p=>[p.id,p]));
const dependents = {}; D.comps.forEach(c=>dependents[c.id]=[]);
D.comps.forEach(c=>c.pre.forEach(p=>dependents[p].push(c.id)));

/* Merge two entries for one ID: the newer `updated` wins per field; differing notes are kept, joined. */

/* ---------- flowchart (dependency order, left to right) ---------- */
const FW=206,FH=60,FGX=96,FGY=14,FTOP=74;
/* The flowchart's node list: collapsed groups become one cluster node; edges are rewired to it. */
function flowNodes(){
  const rep=id=>groupOf[id]&&!expanded.has(groupOf[id])?groupOf[id]:id;const out=[],seen=new Set();
  D.comps.forEach(c=>{const r=rep(c.id);if(seen.has(r))return;seen.add(r);
    if(r===c.id){out.push(Object.assign(compNode(c),{pre:[...new Set(c.pre.map(rep))]}));return}
    const g=groupById[r],ms=g.members.map(m=>byId[m]);
    out.push({id:g.id,group:g,name:g.name,src:ms[0].src,stage:ms[0].stage,lane:ms[0].lane,existing:ms[0].existing,
      pre:[...new Set(ms.flatMap(m=>m.pre).map(rep))].filter(x=>x!==g.id)})});
  return out}
function drawFlow(V){
  const vp=V.vp;vp.innerHTML="";V.nodes={};V._pos={};
  const list=flowNodes(),byN=Object.fromEntries(list.map(n=>[n.id,n]));setGraph(V,list);
  // A-19: job-readiness items with no prerequisites run alongside everything; draw them as a band, not as "Start here"
  const band=list.filter(n=>n.stage==="JOB"&&!n.pre.length),inBand=new Set(band.map(n=>n.id));
  const depth={};const dfs=id=>{if(id in depth)return depth[id];const p=byN[id].pre;return depth[id]=p.length?1+Math.max(...p.map(dfs)):0};
  list.forEach(n=>dfs(n.id));
  const main=list.filter(n=>!inBand.has(n.id));
  const maxD=Math.max(...main.map(n=>depth[n.id]));
  const sOrd=Object.fromEntries(D.stages.map((s,i)=>[s.id,i])),lOrd=Object.fromEntries(D.lanes.map((l,i)=>[l.id,i]));
  const cols=[...Array(maxD+1)].map((_,d)=>main.filter(n=>depth[n.id]===d).sort((a,b)=>sOrd[a.stage]-sOrd[b.stage]||lOrd[a.lane]-lOrd[b.lane]).map(n=>n.id));
  const idx={};band.forEach((n,i)=>idx[n.id]=i);const reindex=()=>cols.forEach(col=>col.forEach((id,i)=>idx[id]=i-(col.length-1)/2));
  reindex();
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
  for(let it=0;it<8;it++){ // barycenter sweeps to reduce crossings
    for(let d=1;d<=maxD;d++){cols[d].sort((a,b)=>avg(byN[a].pre.map(p=>idx[p]))-avg(byN[b].pre.map(p=>idx[p])));reindex()}
    for(let d=maxD-1;d>=0;d--){cols[d].sort((a,b)=>{const da=V.deps[a].map(x=>idx[x]),db=V.deps[b].map(x=>idx[x]);return (da.length?avg(da):idx[a])-(db.length?avg(db):idx[b])});reindex()}
  }
  const maxN=Math.max(...cols.map(c=>c.length)),colH=n=>n*(FH+FGY)-FGY,Hmax=colH(maxN);
  cols.forEach((col,d)=>{const x=30+d*(FW+FGX),y0=FTOP+(Hmax-colH(col.length))/2;
    col.forEach((id,i)=>V._pos[id]={x,y:y0+i*(FH+FGY),w:FW,h:FH})});
  const bandY=FTOP+Hmax+70;band.forEach((n,i)=>V._pos[n.id]={x:30+i*(FW+FGX/2),y:bandY,w:FW,h:FH});
  V.W=Math.max(30+(maxD+1)*(FW+FGX),30+band.length*(FW+FGX/2));V.H=(band.length?bandY+FH:FTOP+Hmax)+30;
  cols.forEach((col,d)=>{const x=30+d*(FW+FGX);
    sv("text",{class:"colh",x,y:30,"font-size":14},vp).textContent=d===0?"Start here":`Step ${d+1}`;
    sv("text",{class:"colsub",x,y:48,"font-size":11},vp).textContent=d===0?"No prerequisites":`Needs step ${d} or earlier`});
  if(band.length){sv("line",{class:"bandrule",x1:20,x2:V.W-20,y1:bandY-40,y2:bandY-40},vp);
    sv("text",{class:"colh",x:30,y:bandY-16,"font-size":14},vp).textContent="Ongoing: portfolio and job readiness";
    sv("text",{class:"colsub",x:320,y:bandY-16,"font-size":11},vp).textContent="No prerequisites; runs alongside every stage, not first"}
  drawEdges(V,vp,"flow",list);
  const ng=sv("g",{},vp);
  [...cols.flat(),...band.map(n=>n.id)].forEach(id=>{const n=byN[id],p=V._pos[id];
    drawNode(V,ng,n,p.x,p.y,p.w,p.h,n.group?[`Group of ${n.group.members.length}`]:[STAGE_SHORT[n.stage],SRC_LABEL[n.src]])});
}

/* Status of a graph node: a cluster aggregates its members. */
function nodeState(n){

  const blocked=ids.every(i=>isBlocked(i)),locked=blocked&&s==="ns";
  return {s,blocked,locked,ids}}

    V.svg.classList.toggle("edges-all",showAllEdges);V.svg.classList.toggle("has-sel",!!sel);V.svg.classList.toggle("chain",!!chain);
    V.edges.forEach(e=>{e.el.classList.toggle("in",!!sel&&e.to===sel);e.el.classList.toggle("out",!!sel&&e.from===sel);
      e.el.classList.toggle("off",!!chain&&!(chain.has(e.from)&&chain.has(e.to)))});
    Object.entries(V.stageBars).forEach(([sid,b])=>{b.g.innerHTML="";const L=compsIn(sid),done=L.filter(i=>st(i)==="done").length,ip=L.filter(i=>st(i)==="ip").length;

      sv("rect",{class:"sbdone",x:b.x,y:b.y,width:b.w*done/L.length,height:6,rx:3},b.g);

function lateHTML(){const items=[...D.stages.map(s=>[`Stage ${s.n}: ${s.name}`,lateStage(s)]),...D.projects.map(p=>[`${p.id}: ${p.name}`,lateProject(p)]),...D.certs.map(k=>[k.name,lateCert(k)])].filter(x=>x[1]);
  if(!items.length)return "";
  return `<div class="blockmsg mt-lg"><h3>Past their window (<span class="num">${items.length}</span>)</h3><p class="mini mt-xs mb-sm">${esc(LATE_HINT)} Decide per item: cut it, move the window, or drop it.</p>
   ${items.map(([n,l])=>`<div class="specrow">${esc(n)} ${lateBadge(l)} <span class="mini"><span class="num">${l.days}</span> days ago</span></div>`).join("")}</div>`}
function radarSVG(){
  const L=D.lanes.filter(l=>D.comps.some(c=>c.lane===l.id)),n=L.length,R=120,cx=170,cy=150;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const val=(l,f)=>{const ids=D.comps.filter(c=>c.lane===l.id).map(c=>c.id);return ids.filter(f).length/ids.length};
  const poly=f=>L.map((l,i)=>pt(i,Math.max(0.02,val(l,f))*R).join(",")).join(" ");
  let g="";[0.25,0.5,0.75,1].forEach(k=>{g+=`<polygon class="rgrid" points="${L.map((_,i)=>pt(i,R*k).join(",")).join(" ")}"/>`});
  L.forEach((l,i)=>{const [x,y]=pt(i,R),[tx,ty]=pt(i,R+18);g+=`<line class="rgrid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/><text class="rlab" x="${tx}" y="${ty+4}" text-anchor="${Math.abs(tx-cx)<10?"middle":tx>cx?"start":"end"}">${esc(l.name)} ${Math.round(100*val(l,id=>st(id)==="done"))}%</text>`});
  g+=`<polygon class="rstart" points="${poly(id=>st(id)!=="ns")}"/>`;
  g+=`<polygon class="rdone" points="${poly(id=>st(id)==="done")}"/>`;
  return `<svg class="radar" viewBox="-130 0 600 300" role="img" aria-label="Skills radar by domain: share of each domain completed">${g}</svg>`;
}

const dlg=document.getElementById("dlg");
const OWN_BY_RECORDS=["level","levelNote","u","e","d","lastVerified"];
const FIELD_LABEL={level:"Level",levelNote:"Records note",u:"Understanding",e:"Execution",d:"Diagnosis",lastVerified:"Last verified"};
function pickImport(){const i=document.createElement("input");i.type="file";i.accept="application/json,.json";i.id="imp-picker";i.style.display="none";
  i.onchange=()=>{const f=i.files[0];i.remove();if(f)readImport(f)};document.body.appendChild(i);i.click()}
function readImport(f){f.text().then(t=>{let parsed=null;try{parsed=parseAny(JSON.parse(t))}catch(_){parsed=null}
  if(!parsed){showDialog(`<h2>Can't import this file</h2><p>It isn't a progress export or a records seed from this app. Nothing was changed.</p><div class="dlgact"><button type="button" class="btn" data-dlg="close">Close</button></div>`);return}
  previewImport(parsed,f.name)})}
function entrySummary(e){if(!e)return "None";const b=[];if(e.status)b.push(ST_LABEL[e.status]);if(e.level)b.push(e.level);if(e.link)b.push("link");if(e.notes)b.push("notes");if(e.evidence)b.push("evidence notes");return b.join(", ")||"None"}
function seedPlan(parsed){const changes=[],skipped=[];
  for(const [id,v] of Object.entries(parsed.progress)){const r=resolveId(id);if(!r.to){skipped.push(id);continue}
    const cur=P(r.to),diff=OWN_BY_RECORDS.filter(k=>(cur[k]||"")!==(v[k]||""));if(diff.length)changes.push({id:r.to,from:cur,to:v,diff})}
  return {changes,skipped}}
function previewImport(parsed,name){
  if(parsed.kind==="seed"){const {changes,skipped}=seedPlan(parsed);
    const fmt=(e,k)=>esc(k==="u"||k==="e"||k==="d"?(e[k]?MARKS[e[k]]:"Not set"):(e[k]||"Not set"));
    showDialog(`<h2>Import records seed</h2><p class="mini">${esc(name)}${parsed.meta.snapshotDate?`, records snapshot ${esc(parsed.meta.snapshotDate)}`:""}</p>
     <p>The records own <b>level, U/E/D and last verified</b>; your statuses, notes and links stay as they are. The seed never marks anything Completed.</p>
     <p><b>${changes.length}</b> competencies change, ${Object.keys(parsed.progress).length-skipped.length} in the seed match, ${skipped.length} not in this roadmap (skipped${skipped.length?": "+esc(skipped.slice(0,12).join(", "))+(skipped.length>12?"…":""):""})</p>
     ${changes.length?`<div class="dlgscroll"><table><thead><tr><th>ID</th><th>Field</th><th>Now</th><th>From records</th></tr></thead><tbody>${changes.flatMap(c=>c.diff.map((k,i)=>`<tr><td>${i?"":esc(c.id)}</td><td>${esc(FIELD_LABEL[k]||k)}</td><td>${fmt(c.from,k)}</td><td>${fmt(c.to,k)}</td></tr>`)).join("")}</tbody></table></div>`:""}
     <p class="mini">A backup of your current progress is downloaded first.</p>
     <div class="dlgact"><button type="button" class="btn" data-dlg="close">Cancel</button>${changes.length?`<button type="button" class="btn primary" data-dlg="seed">Apply ${changes.length} changes</button>`:""}</div>`,
     {seed:()=>{backupNow("seed");for(const c of changes){const e=entry(c.id);for(const k of OWN_BY_RECORDS){if(has(c.to,k))e[k]=c.to[k];else delete e[k]}}touch();refreshAll()}});
    return}
  const n=normalize(parsed.progress,parsed.orphans);const ids=Object.keys(n.progress);
  const conflicts=ids.filter(id=>S.progress[id]&&JSON.stringify(S.progress[id])!==JSON.stringify(n.progress[id]));
  const fresh=ids.filter(id=>!S.progress[id]);const orph=Object.keys(n.orphans);
  showDialog(`<h2>Import progress</h2><p class="mini">${esc(name)}, ${parsed.kind==="v1"?"older format (converted)":"current format"}</p>
   <p><b>${ids.length}</b> competencies with progress in the file: ${fresh.length} new here, ${conflicts.length} differ from what this browser has, ${n.renamed.length} under an old ID (carried over), ${orph.length} orphaned (kept, shown on the dashboard).</p>
   ${conflicts.length?`<div class="dlgscroll"><table><thead><tr><th>ID</th><th>In this browser</th><th>In the file</th></tr></thead><tbody>${conflicts.map(id=>`<tr><td>${esc(id)}</td><td>${esc(entrySummary(S.progress[id]))}</td><td>${esc(entrySummary(n.progress[id]))}</td></tr>`).join("")}</tbody></table></div>`:""}
   <p><b>Merge</b> keeps both: for each competency the newer change wins and differing notes are kept together. <b>Replace</b> makes this browser match the file exactly.</p>
   <p class="mini">A backup of your current progress is downloaded first.</p>
   <div class="dlgact"><button type="button" class="btn" data-dlg="close">Cancel</button><button type="button" class="btn danger" data-dlg="replace">Replace</button><button type="button" class="btn primary" data-dlg="merge">Merge</button></div>`,
   {merge:()=>{backupNow("import");for(const id of ids)S.progress[id]=mergeEntry(S.progress[id],n.progress[id]);for(const id of orph)S.orphans[id]=Object.assign(mergeEntry(S.orphans[id],n.orphans[id]),{reason:n.orphans[id].reason,splitInto:n.orphans[id].splitInto});finishImport(parsed)},
    replace:()=>{backupNow("import");S.progress=n.progress;S.orphans=n.orphans;finishImport(parsed)}});
}
function finishImport(parsed){for(const id of Object.keys(S.orphans))if(!S.orphans[id].splitInto)delete S.orphans[id].splitInto;
  S.firstRunDismissed=true;if(parsed.meta&&parsed.meta.lastExportAt&&!S.lastExportAt)S.lastExportAt=parsed.meta.lastExportAt;touch();refreshAll()}
function showDialog(html,actions){dlg.innerHTML=html;dlg.onclick=e=>{const b=e.target.closest("[data-dlg]");if(!b)return;const a=b.dataset.dlg;dlg.close();if(a!=="close"&&actions&&actions[a])actions[a]()};

/* ---------- lateness (D-10): a window passed with the work not done ---------- */
const today = () => (typeof window.ROADMAP_TODAY==="string"&&!isNaN(Date.parse(window.ROADMAP_TODAY)))?Date.parse(window.ROADMAP_TODAY):Date.now();
const endOfDay = d => Date.parse(d+"T23:59:59");
const monthEnd = ym => {const [y,m]=ym.split("-").map(Number);return new Date(y,m,0,23,59,59).getTime()};
const fmtDate = t => new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
function lateness(dueMs,comps){if(dueMs==null||!comps.length||today()<=dueMs||pct(comps)===100)return null;return {due:dueMs,days:Math.floor((today()-dueMs)/DAY)}}
const lateStage = s => lateness(s.due?endOfDay(s.due):null,compsIn(s.id));
const lateProject = p => lateness(p.due?endOfDay(p.due):null,p.comps);
const lateCert = k => lateness(k.end?monthEnd(k.end):null,k.comps);
const LATE_HINT = "Cut scope or re-plan. Missed time doesn't roll over (doc 18).";
const lateBadge = l => l?`<span class="badge late" title="${esc(LATE_HINT)}">Late: window ended ${esc(fmtDate(l.due))}</span>`:"";

/* ---------- timetable (D-10): committed only as AES-GCM ciphertext; unlocked in the browser ---------- */
const TT_ITER=600000, TT_MIN_PW=14;
let TT=null, ttError="", ttBlobOut=null;
const te=new TextEncoder(), td=new TextDecoder();
function b64(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const unb64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const cryptoOK = () => !!(window.crypto&&crypto.subtle);
async function ttKey(pw,salt,iter){const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function ttEncrypt(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await ttKey(pw,salt,TT_ITER),te.encode(JSON.stringify(obj))));
  return {v:1,kdf:"PBKDF2-SHA256",iter:TT_ITER,cipher:"AES-256-GCM",salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function ttDecrypt(blob,pw){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(blob.iv)},await ttKey(pw,unb64(blob.salt),blob.iter),unb64(blob.ct));
  return cleanTimetable(JSON.parse(td.decode(pt)))}
function cleanTimetable(o){if(!isObj(o)||!Array.isArray(o.rows))throw new Error("shape");
  return {updated:str(o.updated,20)||"",notes:str(o.notes,4000)||"",rows:o.rows.slice(0,200).filter(isObj).map(r=>({when:str(r.when,200)||"",what:str(r.what,1000)||""})).filter(r=>r.when||r.what)}}
const rowsToText = rows => rows.map(r=>`${r.when} | ${r.what}`).join("\n");
const textToRows = t => t.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf("|");return i<0?{when:l,what:""}:{when:l.slice(0,i).trim(),what:l.slice(i+1).trim()}});
function renderTimetable(){
  const v=document.getElementById("v-time"),blob=D.timetable;
  const lock=!TT?(blob?`<form class="unlock" id="ttunlock"><label class="lbl" for="ttpw">Password</label>
      <div class="row"><input id="ttpw" type="password" autocomplete="current-password"><button class="btn primary" type="submit">Unlock</button></div>
      ${ttError?`<p class="err" role="alert">${esc(ttError)}</p>`:""}
      <p class="mini mt-xs">Decrypted in this tab only; nothing is sent or stored.</p></form>`
    :`<div class="note">No timetable is published yet. Create one below, save the file as <code>data/timetable.enc.json</code>, rebuild and commit.</div>`)
    :`<div class="box"><div class="boxhead"><h3>Weekly timetable</h3>${TT.updated?`<span class="mini">Updated <span class="mono">${esc(TT.updated)}</span></span>`:""}<button type="button" class="btn" id="ttlock">Lock</button></div>
      <table class="mt-xs"><colgroup><col style="width:38%"><col></colgroup><thead><tr><th>When</th><th>What</th></tr></thead><tbody>${TT.rows.map(r=>`<tr class="cl"><td><b>${esc(r.when)}</b></td><td>${esc(r.what)}</td></tr>`).join("")}</tbody></table>
      ${TT.notes?`<p class="mini mt-sm pre-wrap">${esc(TT.notes)}</p>`:""}</div>`;
  v.innerHTML=`<div class="page"><div class="phead"><div><h2>Timetable</h2><p class="lead">Your week, and whether you're behind. The timetable is published only as encrypted data (AES-256-GCM, key from your password with PBKDF2, ${TT_ITER.toLocaleString()} rounds). Anyone can download the ciphertext, so a weak password can be guessed offline; use a long one.</p></div></div>
   ${cryptoOK()?lock:`<div class="warn">This browser doesn't allow Web Crypto on this page (it needs https or a local file). Open the published site to unlock the timetable.</div>`}
   ${lateHTML()||`<div class="note mt-lg">Nothing is past its window. Lateness counts stages, projects and certs whose window ended with work not done; missed sessions never roll over.</div>`}
   ${cryptoOK()?`<details class="box mt-lg" ${ttBlobOut?"open":""}><summary>Create or replace the encrypted timetable</summary>
    <p class="mini mb-xs">One row per line: <code>when | what</code>. ${TT?"Prefilled from the unlocked timetable.":""}</p>
    <textarea id="ttrows" rows="8" aria-label="Timetable rows" placeholder="Mon 19:00 to 20:00 | Example: one course item&#10;Sat 10:00 to 12:00 | Example: project work">${TT?esc(rowsToText(TT.rows)):""}</textarea>
    <label class="lbl" for="ttnotes">Notes (optional)</label><textarea id="ttnotes" rows="2">${TT?esc(TT.notes):""}</textarea>
    <div class="evgrid mt-sm"><label>New password<input id="ttnew" type="password" autocomplete="new-password"></label><label>Repeat it<input id="ttnew2" type="password" autocomplete="new-password"></label></div>
    <p class="mini mt-xs mb-sm" id="ttstrength"></p>
    <button type="button" class="btn primary" id="ttenc">Encrypt</button>
    ${ttBlobOut?`<div class="mt-sm"><p class="mini mb-xs">Encrypted. Save it as <code>data/timetable.enc.json</code>, run <code>python3 tools/build.py</code>, then commit. The password is not in the file; don't lose it.</p>
      <textarea id="ttout" rows="4" readonly aria-label="Encrypted timetable">${esc(JSON.stringify(ttBlobOut))}</textarea><button type="button" class="btn mt-xs" id="ttdl">Download timetable.enc.json</button></div>`:""}
   </details>`:""}</div>`;
  const f=v.querySelector("#ttunlock");
  if(f)f.onsubmit=async e=>{e.preventDefault();const pw=v.querySelector("#ttpw").value;ttError="";
    try{TT=await ttDecrypt(blob,pw)}catch(_){TT=null;ttError="That password doesn't open this timetable."}renderTimetable();if(!TT)v.querySelector("#ttpw").focus()};
  const lk=v.querySelector("#ttlock");if(lk)lk.onclick=()=>{TT=null;ttBlobOut=null;renderTimetable()};
  const nw=v.querySelector("#ttnew"),strength=v.querySelector("#ttstrength");
  const judge=()=>{if(!nw)return;const n=nw.value.length;strength.textContent=!n?`Use at least ${TT_MIN_PW} characters; a few random words work well.`:n<TT_MIN_PW?`⚠ ${n} characters: short passwords can be guessed offline. ${TT_MIN_PW}+ recommended.`:`${n} characters.`;strength.classList.remove("badt");strength.classList.toggle("warnt",!!n&&n<TT_MIN_PW)};
  if(nw){nw.oninput=judge;judge();
    v.querySelector("#ttenc").onclick=async()=>{const p1=nw.value,p2=v.querySelector("#ttnew2").value;
      if(!p1){strength.textContent="Enter a password.";return}if(p1!==p2){strength.textContent="The two passwords don't match.";strength.classList.add("badt");return}
      const rows=textToRows(v.querySelector("#ttrows").value);if(!rows.length){strength.textContent="Add at least one row.";return}
      ttBlobOut=await ttEncrypt({kind:"timetable",v:1,updated:new Date().toISOString().slice(0,10),rows,notes:v.querySelector("#ttnotes").value},p1);renderTimetable()};}
  const dl=v.querySelector("#ttdl");if(dl)dl.onclick=()=>download(ttBlobOut,"timetable.enc.json");
}

/* ---------- keyboard: Escape closes the panel; "/" focuses search ---------- */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&panel.classList.contains("on")&&!dlg.open){e.preventDefault();closePanel()}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(e.key==="/"&&!typing&&GRAPHS[curView]){const s=document.querySelector(`#v-${curView} .gsearch`);if(s){e.preventDefault();s.focus()}}});
/* ---------- deep links: #NET-3 opens that competency; #PY-1–7 opens the group ---------- */
function fromHash(){let id="";try{id=decodeURIComponent(location.hash.slice(1))}catch(_){return}if(!id)return;
  if(byId[id]){if(!GRAPHS[curView])showView("flow");select(id,{center:true,focus:false})}else if(groupById[id]){if(!GRAPHS[curView])showView("flow");openGroup(id,{center:true})}}
window.addEventListener("hashchange",fromHash);
/* ---------- header + refresh ---------- */
function renderHeader(){document.getElementById("ver").textContent="v"+D.version;document.getElementById("hpct").textContent=`${ALL.filter(i=>st(i)==="done").length}/${ALL.length} done`;document.getElementById("hbar").outerHTML=barHTML(ALL).replace('class="bar"','class="bar" id="hbar"')}
/* ---------- colour mode: auto (follows the OS), light or dark; kept in its own key, never in progress ---------- */
const MODE_KEY="ntidebi-mode",MODES=["auto","light","dark"],MODE_LABEL={auto:"Auto",light:"Light",dark:"Dark"};
function applyMode(m){if(m==="light"||m==="dark")document.documentElement.dataset.mode=m;else delete document.documentElement.dataset.mode;
  const b=document.getElementById("modebtn");b.textContent=MODE_LABEL[m];b.setAttribute("aria-label",`Colour mode: ${MODE_LABEL[m]}. Switch mode`)}
let curMode=(()=>{const m=readKey(MODE_KEY);return MODES.includes(m)?m:"auto"})();applyMode(curMode);
document.getElementById("modebtn").addEventListener("click",()=>{curMode=MODES[(MODES.indexOf(curMode)+1)%MODES.length];if(curMode==="auto"){try{localStorage.removeItem(MODE_KEY)}catch(e){}}else writeKey(MODE_KEY,curMode);applyMode(curMode)});
function refreshAll(){renderNotices();renderHeader();renderGraphState();if(!GRAPHS[curView])renderView(curView);if(selId&&panel.classList.contains("on"))openComp(selId)}
renderGraphState();renderHeader();renderNotices();
requestAnimationFrame(()=>{GRAPHS.flow.fit();fromHash()});
</script>
