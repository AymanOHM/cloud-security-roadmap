<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTI + DEBI Unified Roadmap</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c222b;--line:#2a313c;--line2:#3a4350;
  --text:#e6edf3;--muted:#9da7b3;--faint:#8b949e;
  --NTI:#4c8dff;--DEBI:#c27bff;--IND:#f0a83a;--SHARED:#2fbfa8;--EXIST:#9aabbd;
  --ns:#6e7681;--ip:#e3b341;--done:#3fb950;--blocked:#f85149;--rec:#3fb950;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--NTI)}
.app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
header .ver{color:var(--muted);font-size:12px}
.hprog{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex;min-width:80px}
.bar span{display:block;height:100%}
nav{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--NTI)}
main{flex:1;display:flex;min-height:0;position:relative}
.view{flex:1;min-width:0;overflow:auto;display:none}
.view.on{display:block}
.gview.on{display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--bg)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.on{border-color:var(--NTI);background:#1a2638}
.btn.danger{border-color:#5a2a2a;color:#ffaba8}
select.btn{padding:5px 8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid;vertical-align:-2px;margin-right:4px;background:var(--panel)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.canvas{flex:1;position:relative;overflow:hidden;cursor:grab;background:
  radial-gradient(circle,#1b212a 1px,transparent 1px) 0 0/22px 22px}
.canvas.drag{cursor:grabbing}
.canvas{touch-action:none}
.node:focus{outline:none}
.node:focus-visible .box{stroke:#fff;stroke-width:3}
.node.stagehd:focus-visible text{text-decoration:underline}
.cluster .box{stroke-width:2}
.has-sel.chain .edge.flow,.chain .edge.off{opacity:.04}
:focus-visible{outline:2px solid #58a6ff;outline-offset:2px}
.gsearch{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;width:220px;max-width:100%}
.gsearch.nomatch{border-color:var(--blocked)}
.legwrap{display:contents}
.legwrap>summary{display:none}
.kcol.nodrop{border-color:var(--blocked);cursor:not-allowed}
button.chip{font:inherit;color:inherit}
.canvas svg{position:absolute;inset:0;width:100%;height:100%;user-select:none}
.node{cursor:pointer}
.node .box{fill:var(--panel);stroke-width:1.5}
.node:hover .box{fill:var(--panel2)}
.node.sel .box{stroke-width:3}
.node.dim{opacity:.22}
.node.blk .box{opacity:.6}.node.blk text{opacity:.7}
.edge{fill:none;stroke:var(--line2);stroke-width:1.2;opacity:.0}
.edges-all .edge{opacity:.35}
.edge.flow{opacity:.55}
.has-sel .edge.flow{opacity:.12}
.has-sel .edge.in,.has-sel .edge.out{opacity:1}
.edge.in{stroke:#58a6ff;opacity:1;stroke-width:2}
.edge.out{stroke:#d2a8ff;opacity:1;stroke-width:2}
.zoombox{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoombox .btn{width:34px;height:34px;padding:0}
/* side panel */
#panel{width:420px;max-width:100%;border-left:1px solid var(--line);background:var(--panel);overflow:auto;display:none;flex-shrink:0}
#panel.on{display:block}
#panel .ph{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;gap:8px;align-items:flex-start;z-index:1}
#panel .ph h2{margin:0;font-size:16px;line-height:1.3}
#panel .pid{font-size:12px;font-weight:700;letter-spacing:.3px}
#panel .close{margin-left:auto;flex-shrink:0}
#panel .pb{padding:12px 14px 40px}
.sec{margin:14px 0}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 6px;font-weight:650}
.sec p{margin:0}
.sec ul{margin:0;padding-left:18px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.statusset{display:flex;gap:6px}
.statusset button{flex:1;padding:7px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:12px}
.statusset button.on[data-s="ns"]{border-color:var(--ns);background:#22272e}
.statusset button.on[data-s="ip"]{border-color:var(--ip);background:#2a2410}
.statusset button.on[data-s="done"]{border-color:var(--done);background:#12261a}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 8px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;margin:0 4px 4px 0}
.chip:hover{border-color:var(--muted)}
textarea{width:100%;min-height:70px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:8px;resize:vertical}
.warn{border:1px solid #5a4a1a;background:#221c0c;color:#e8d28a;border-radius:6px;padding:8px 10px;font-size:12px}
.blockmsg{border:1px solid #5a2a2a;background:#2a1414;color:#ffb3ae;border-radius:6px;padding:8px 10px;font-size:12px}
.unk{color:var(--faint);font-style:italic}
/* generic pages */
.page{padding:18px 20px 60px;max-width:1200px}
.page h2{font-size:18px;margin:0 0 4px}
.page .lead{color:var(--muted);margin:0 0 16px;max-width:820px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--bg)}
tr.cl:hover td{background:var(--panel)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{font-size:26px;font-weight:700}
.kpil{font-size:12px;color:var(--muted)}
.stagehead{display:flex;align-items:center;gap:10px;margin:22px 0 6px}
.stagehead h3{margin:0;font-size:15px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;min-width:180px}
.srcb{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid;white-space:nowrap}
.mini{font-size:12px;color:var(--muted)}
.pathcard{cursor:pointer}
.pathcard.rec{border-color:var(--rec)}
.pathcard.on{outline:2px solid var(--NTI)}
.trunk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 18px}
.trunk .seg{padding:8px 12px;border:1px solid var(--line2);border-radius:6px;background:var(--panel)}
.arrow{color:var(--faint)}
.proj{position:relative}
.projflow{display:grid;gap:12px}
.tl{position:relative;margin-top:10px}
.tlgrid{display:grid;grid-template-columns:160px 1fr;gap:0}
.tlrow{display:contents}
.tllab{padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}
.tltrack{position:relative;border-bottom:1px solid var(--line);min-height:44px}
.tlbar{position:absolute;top:10px;height:24px;border-radius:5px;font-size:11px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid}
.tlmonths{display:flex;font-size:11px;color:var(--muted)}
.tlmonths div{flex:1;border-left:1px solid var(--line);padding-left:3px}
.today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ip)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;align-items:start}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 260px);min-height:200px}
.kcol.over{border-color:var(--NTI);background:#15202e}
.khead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.khead .mini{width:100%}
.kbody{padding:8px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid;border-radius:6px;padding:8px 10px;cursor:grab}
.kcard:hover{border-color:var(--muted)}
.kcard.dragging{opacity:.4}
.kname{font-weight:600;font-size:13px;margin-bottom:4px}
.kmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#notice:empty{display:none}
#notice{border-bottom:1px solid var(--line);background:var(--panel)}
.notice{padding:8px 16px;font-size:13px;border-left:3px solid var(--ip)}
.notice+.notice{border-top:1px solid var(--line)}
.notice .btn{padding:2px 8px;font-size:12px;margin-left:4px}
dialog#dlg{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:10px;max-width:min(760px,94vw);padding:18px 20px}
dialog#dlg::backdrop{background:rgba(0,0,0,.6)}
dialog#dlg h2{margin:0 0 6px;font-size:17px}
.dlgscroll{max-height:40vh;overflow:auto;margin:8px 0;border:1px solid var(--line);border-radius:6px}
.dlgact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.evgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.evgrid input,.evgrid select{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:5px 7px;color:var(--text)}
.evgrid .wide{grid-column:1/-1}
.badge.noev{color:#e8d28a;border-color:#5a4a1a}
.badge.late{color:#ffb3ae;border-color:#5a2a2a}
footer.note{color:var(--faint);font-size:12px;padding:16px 20px;border-top:1px solid var(--line)}
@media (max-width:900px){
  #panel{position:absolute;inset:0;width:100%;z-index:5}
  header .ver{display:none}
}
/* phones (A-17): toolbar and legend fold away, Kanban stacks, the checklist becomes cards, tables scroll inside themselves */
@media (max-width:700px){
  header{padding:8px 12px;gap:8px}
  header h1{font-size:14px}
  .hprog .bar{width:90px!important}
  .toolbar{padding:6px 8px;gap:6px}
  .gsearch{width:100%;order:-1}
  .legwrap{display:block;width:100%}
  .legwrap>summary{display:inline-block;list-style:none}
  .legwrap .legend{margin-top:6px}
  .page{padding:14px 12px 60px}
  .kanban{grid-template-columns:1fr}
  .kcol{max-height:none}
  .g2{grid-template-columns:1fr}
  .page table{display:block;overflow-x:auto}
  #v-checklist table{display:block;overflow:visible}
  #v-checklist thead{display:none}
  #v-checklist tbody{display:block}
  #v-checklist tr.cl{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
  #v-checklist td{border:0;padding:0}
  #v-checklist td:nth-child(3){order:-1;flex-basis:100%;font-weight:600}
  #v-checklist td:nth-child(6){flex-basis:100%}
  .tlgrid{grid-template-columns:90px 1fr}
  .notice{padding:8px 12px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>NTI + DEBI Unified Roadmap</h1><span class="ver" id="ver"></span>
  <div class="hprog"><span id="hpct"></span><div class="bar" style="width:160px" id="hbar"></div></div>
</header>
<nav id="tabs" role="tablist" aria-label="Views">
  <button role="tab" id="tab-flow" aria-controls="v-flow" aria-selected="true" data-v="flow" class="on">Flowchart</button>
  <button role="tab" id="tab-roadmap" aria-controls="v-roadmap" aria-selected="false" tabindex="-1" data-v="roadmap">Stage map</button>
  <button role="tab" id="tab-kanban" aria-controls="v-kanban" aria-selected="false" tabindex="-1" data-v="kanban">Kanban</button>
  <button role="tab" id="tab-checklist" aria-controls="v-checklist" aria-selected="false" tabindex="-1" data-v="checklist">Checklist</button>
  <button role="tab" id="tab-paths" aria-controls="v-paths" aria-selected="false" tabindex="-1" data-v="paths">Career paths</button>
  <button role="tab" id="tab-compare" aria-controls="v-compare" aria-selected="false" tabindex="-1" data-v="compare">NTI vs DEBI</button>
  <button role="tab" id="tab-projects" aria-controls="v-projects" aria-selected="false" tabindex="-1" data-v="projects">Projects</button>
  <button role="tab" id="tab-certs" aria-controls="v-certs" aria-selected="false" tabindex="-1" data-v="certs">Certifications</button>
  <button role="tab" id="tab-time" aria-controls="v-time" aria-selected="false" tabindex="-1" data-v="time">Timetable</button>
  <button role="tab" id="tab-dash" aria-controls="v-dash" aria-selected="false" tabindex="-1" data-v="dash">Dashboard</button>
</nav>
<div id="notice" role="status"></div>
<main>
  <section class="view gview on" id="v-flow" role="tabpanel" aria-labelledby="tab-flow">
    <div class="toolbar gtool"></div>
    <div class="canvas" id="cv-flow">
      <svg xmlns="http://www.w3.org/2000/svg"><g class="vp"></g></svg>
      <div class="zoombox"><button class="btn zin" title="Zoom in" aria-label="Zoom in">+</button><button class="btn zout" title="Zoom out" aria-label="Zoom out">−</button><button class="btn zfit" title="Toggle: whole map / fit width" aria-label="Toggle whole map or fit width">⤢</button></div>
    </div>
  </section>
  <section class="view gview" id="v-roadmap" role="tabpanel" aria-labelledby="tab-roadmap">
    <div class="toolbar gtool" data-edges="1"></div>
    <div class="canvas" id="cv-roadmap">
      <svg xmlns="http://www.w3.org/2000/svg"><g class="vp"></g></svg>
      <div class="zoombox"><button class="btn zin" title="Zoom in" aria-label="Zoom in">+</button><button class="btn zout" title="Zoom out" aria-label="Zoom out">−</button><button class="btn zfit" title="Toggle: whole map / fit width" aria-label="Toggle whole map or fit width">⤢</button></div>
    </div>
  </section>
  <section class="view" id="v-kanban" role="tabpanel" aria-labelledby="tab-kanban"></section>
  <section class="view" id="v-checklist" role="tabpanel" aria-labelledby="tab-checklist"></section>
  <section class="view" id="v-paths" role="tabpanel" aria-labelledby="tab-paths"></section>
  <section class="view" id="v-compare" role="tabpanel" aria-labelledby="tab-compare"></section>
  <section class="view" id="v-projects" role="tabpanel" aria-labelledby="tab-projects"></section>
  <section class="view" id="v-certs" role="tabpanel" aria-labelledby="tab-certs"></section>
  <section class="view" id="v-time" role="tabpanel" aria-labelledby="tab-time"></section>
  <section class="view" id="v-dash" role="tabpanel" aria-labelledby="tab-dash"></section>
  <aside id="panel" aria-label="Details"></aside>
</main>
</div>
<dialog id="dlg" aria-label="Import"></dialog>
<script>
"use strict";
const D = /*DATA*/null;
const KEY = "ntidebi-roadmap-v1";
const SRC_LABEL = {NTI:"NTI",DEBI:"DEBI",IND:"Independent",SHARED:"Shared",EXIST:"Existing"};
const ST_LABEL = {ns:"Not started",ip:"In progress",done:"Completed"};
const PRI = {H:"High",M:"Medium",L:"Low"};
const byId = Object.fromEntries(D.comps.map(c=>[c.id,c]));
const stageById = Object.fromEntries(D.stages.map(s=>[s.id,s]));
const pathById = Object.fromEntries(D.paths.map(p=>[p.id,p]));
const dependents = {}; D.comps.forEach(c=>dependents[c.id]=[]);
D.comps.forEach(c=>c.pre.forEach(p=>dependents[p].push(c.id)));
const projByComp = {}; D.projects.forEach(p=>p.comps.forEach(id=>(projByComp[id]=projByComp[id]||[]).push(p.id)));

/* ---------- storage (v2 envelope; see development/ARCHITECTURE.md §5) ---------- */
const APP_ID = "nti-debi-roadmap";
const KEY1 = "ntidebi-roadmap-v1", KEY2 = "ntidebi-roadmap-v2";
const KEY1_BACKUP = KEY1 + "-backup", KEY2_PREV = KEY2 + "-prev";
const LEVELS = ["E0","E1","E2","E3","E4"];
const MARKS = {none:"⚪ Not assessed",partial:"🟡 Partial",verified:"🟢 Verified",regressed:"🔴 Regressed"};
const DAY = 864e5, BACKUP_DAYS = 7;
let storageOK = true;
const has = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const nowISO = () => new Date().toISOString();
const isObj = o => !!o && typeof o === "object" && !Array.isArray(o);
const str = (v,max) => typeof v === "string" ? v.slice(0,max) : undefined;
const isoOK = v => typeof v === "string" && !isNaN(Date.parse(v));
function blankEnv(){return {app:APP_ID,storageVersion:2,dataVersion:D.version,createdAt:nowISO(),savedAt:null,lastChangeAt:null,lastExportAt:null,seen:null,firstRunDismissed:false,progress:{},orphans:{}}}
/* One progress entry: keep only known fields with valid values. */
function cleanEntry(o){
  if(!isObj(o))return null;const e={};
  if(has(ST_LABEL,o.status))e.status=o.status;
  for(const [k,max] of [["notes",20000],["evidence",20000],["link",2000],["levelNote",120]]){const s=str(o[k],max);if(s)e[k]=s}
  if(LEVELS.includes(o.level))e.level=o.level;
  for(const k of ["u","e","d"])if(has(MARKS,o[k]))e[k]=o[k];
  if(typeof o.lastVerified==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(o.lastVerified))e.lastVerified=o.lastVerified;
  if(isoOK(o.updated))e.updated=o.updated;
  return Object.keys(e).length?e:null}
/* Read any accepted file shape: v2 envelope, v1 export, or a records seed. Returns null if unrecognised. */
function parseAny(o){
  if(!isObj(o))return null;
  if(o.kind==="roadmap-progress-seed"&&isObj(o.entries)){const entries={};
    for(const [id,v] of Object.entries(o.entries)){if(typeof id!=="string"||!isObj(v))continue;const e=cleanEntry(v)||{};
      const keep={};for(const k of ["level","levelNote","u","e","d","lastVerified"])if(has(e,k))keep[k]=e[k];
      entries[id]=keep}  // an empty entry clears what the records no longer show
    return {kind:"seed",progress:entries,orphans:{},meta:{snapshotDate:str(o.snapshotDate,40)||"",source:str(o.source,200)||""}}}
  if(o.app===APP_ID&&o.storageVersion===2&&isObj(o.progress)){const progress={},orphans={};
    for(const [id,v] of Object.entries(o.progress)){const e=cleanEntry(v);if(e)progress[id]=e}
    if(isObj(o.orphans))for(const [id,v] of Object.entries(o.orphans)){const e=cleanEntry(v);if(!e)continue;
      e.reason=["removed","split","unknown"].includes(v.reason)?v.reason:"unknown";
      if(Array.isArray(v.splitInto))e.splitInto=v.splitInto.filter(x=>typeof x==="string").slice(0,50);orphans[id]=e}
    return {kind:"v2",progress,orphans,meta:{lastExportAt:isoOK(o.lastExportAt)?o.lastExportAt:null,createdAt:isoOK(o.createdAt)?o.createdAt:null,seen:isObj(o.seen)&&Array.isArray(o.seen.ids)?{dataVersion:str(o.seen.dataVersion,80)||"",ids:o.seen.ids.filter(x=>typeof x==="string")}:null,firstRunDismissed:o.firstRunDismissed===true}}}
  if(isObj(o.status)){const progress={};   // v1: {status,notes,evidence,updated}, one map per field
    const ids=new Set();for(const k of ["status","notes","evidence","updated"])if(isObj(o[k]))Object.keys(o[k]).forEach(id=>ids.add(id));
    for(const id of ids){const e=cleanEntry({status:(o.status||{})[id],notes:isObj(o.notes)?o.notes[id]:undefined,evidence:isObj(o.evidence)?o.evidence[id]:undefined,updated:isObj(o.updated)?o.updated[id]:undefined});if(e)progress[id]=e}
    return {kind:"v1",progress,orphans:{},meta:{}}}
  return null}
/* Follow D.migrations from an old ID. Returns {to:id} | {split:[ids]} | {gone:true}. */
function resolveId(id){
  let cur=id;for(let i=0;i<25;i++){
    if(has(byId,cur))return {to:cur};
    if(!has(D.migrations,cur))return {gone:true};
    const n=D.migrations[cur];if(Array.isArray(n))return {split:n.filter(x=>has(byId,x))};cur=n}
  return {gone:true}}
/* Merge two entries for one ID: the newer `updated` wins per field; differing notes are kept, joined. */
function mergeEntry(a,b){if(!a)return b;if(!b)return a;
  const [older,newer]=(Date.parse(a.updated||0)||0)<=(Date.parse(b.updated||0)||0)?[a,b]:[b,a];
  const m=Object.assign({},older,newer);

  const idx={};band.forEach((n,i)=>idx[n.id]=i);const reindex=()=>cols.forEach(col=>col.forEach((id,i)=>idx[id]=i-(col.length-1)/2));
  reindex();

  V.W=Math.max(30+(maxD+1)*(FW+FGX),30+band.length*(FW+FGX/2));V.H=(band.length?bandY+FH:FTOP+Hmax)+30;
  cols.forEach((col,d)=>{const x=30+d*(FW+FGX);
    sv("text",{x,y:30,fill:"#e6edf3","font-size":13,"font-weight":650},vp).textContent=d===0?"Start here":`Step ${d+1}`;
    sv("text",{x,y:48,fill:"#9da7b3","font-size":11},vp).textContent=d===0?"No prerequisites":`Needs step ${d} or earlier`});
  if(band.length){sv("line",{x1:20,x2:V.W-20,y1:bandY-40,y2:bandY-40,stroke:"#2a313c","stroke-dasharray":"4 4"},vp);
    sv("text",{x:30,y:bandY-16,fill:"#e6edf3","font-size":13,"font-weight":650},vp).textContent="Ongoing: portfolio and job readiness";
    sv("text",{x:300,y:bandY-16,fill:"#9da7b3","font-size":11},vp).textContent="No prerequisites; runs alongside every stage, not first"}
  drawEdges(V,vp,"flow",list);
  const ng=sv("g",{},vp);
  [...cols.flat(),...band.map(n=>n.id)].forEach(id=>{const n=byN[id],p=V._pos[id];
    drawNode(V,ng,n,p.x,p.y,p.w,p.h,n.group?`${n.group.members.length} competencies · group`:`${STAGE_SHORT[n.stage]} · ${SRC_LABEL[n.src]}`)});
}

/* Status of a graph node: a cluster aggregates its members. */
function nodeState(n){
  const ids=n.group?n.group.members:[n.id];const ss=ids.map(st);
  const s=ss.every(x=>x==="done")?"done":ss.some(x=>x!=="ns")?"ip":"ns";
  const blocked=ids.every(i=>isBlocked(i)),locked=blocked&&s==="ns";
  return {s,blocked,locked,ids}}
const repKey = (V,id) => id&&!V.nodes[id]&&groupOf[id]&&V.nodes[groupOf[id]]?groupOf[id]:id;
function chainOf(V,id){const up=new Set([id]),down=new Set([id]);
  const go=(k,map,seen)=>(map[k]||[]).forEach(x=>{if(!seen.has(x)){seen.add(x);go(x,map,seen)}});
  go(id,V.pre,up);go(id,V.deps,down);return new Set([...up,...down])}
function renderGraphState(){
  Object.values(GRAPHS).forEach(V=>{
    const sel=repKey(V,selId),chain=chainMode&&sel&&V.nodes[sel]?chainOf(V,sel):null;
    Object.values(V.nodes).forEach(N=>{const n=N.n,{s,blocked,locked,ids}=nodeState(n);
      N.lock.style.display=locked?"":"none";N.dot.style.display=locked?"none":"";
      N.dot.setAttribute("fill",s==="done"?"var(--done)":s==="ip"?"var(--ip)":"none");
      N.dot.setAttribute("stroke",s==="ns"?"#e6edf3":"none");N.dot.setAttribute("stroke-width",1.5);
      N.box.style.fill=s==="done"?"#122119":s==="ip"?"#231f10":"";
      N.g.classList.toggle("blk",blocked);N.g.classList.toggle("sel",n.id===sel);
      let dim=false;if(pathFilter)dim=!ids.some(i=>byId[i].paths.includes("core")||byId[i].paths.includes(pathFilter));
      if(blockedOnly)dim=dim||!blocked;if(chain)dim=dim||!chain.has(n.id);
      N.g.classList.toggle("dim",dim);
      const done=ids.filter(i=>st(i)==="done").length;
      N.g.setAttribute("aria-label",n.group?`${n.name}, group of ${ids.length}: ${done} of ${ids.length} completed. Open the group`
        :`${n.name}, ${n.id}: ${locked?"locked, prerequisites not done":ST_LABEL[s]}${noEvidence(n.id)?", completed without evidence":""}`)});
    V.svg.classList.toggle("edges-all",showAllEdges);V.svg.classList.toggle("has-sel",!!sel);V.svg.classList.toggle("chain",!!chain);
    V.edges.forEach(e=>{e.el.classList.toggle("in",!!sel&&e.to===sel);e.el.classList.toggle("out",!!sel&&e.from===sel);
      e.el.classList.toggle("off",!!chain&&!(chain.has(e.from)&&chain.has(e.to)))});
    Object.entries(V.stageBars).forEach(([sid,b])=>{b.g.innerHTML="";const L=compsIn(sid),done=L.filter(i=>st(i)==="done").length,ip=L.filter(i=>st(i)==="ip").length;
      sv("rect",{x:b.x,y:b.y,width:b.w,height:6,rx:3,fill:"#2a313c"},b.g);
      sv("rect",{x:b.x,y:b.y,width:b.w*done/L.length,height:6,rx:3,fill:"var(--done)"},b.g);
      sv("rect",{x:b.x+b.w*done/L.length,y:b.y,width:b.w*ip/L.length,height:6,fill:"var(--ip)"},b.g);
      sv("text",{x:b.x+b.w+6,y:b.y+7,fill:"#9da7b3","font-size":11},b.g).textContent=`${done}/${L.length}`});
  });
}

  return `<div class="card" style="margin-top:12px"><h3 style="margin:0 0 4px;font-size:14px">Orphaned progress (${ids.length})</h3><p class="mini" style="margin:0 0 8px">Progress saved under IDs this roadmap no longer has. Nothing was dropped: move it to a competency or delete it. A split ID's progress is never copied to its parts automatically, because finishing a group doesn't prove each part.</p>
   <table><thead><tr><th>Old ID</th><th>Why</th><th>What it holds</th><th>Move to</th><th></th></tr></thead><tbody>${ids.map(id=>{const o=S.orphans[id],sug=(o.splitInto||[]).filter(x=>byId[x]);
    return `<tr><td><b>${esc(id)}</b></td><td class="mini">${o.reason==="split"?`Split into ${esc(sug.join(", "))}`:o.reason==="removed"?"Removed from the roadmap":"Unknown ID"}</td><td class="mini">${esc(entrySummary(o))}${o.notes?`<div>“${esc(trunc(o.notes,80))}”</div>`:""}</td>
     <td><select class="btn" data-orphto="${esc(id)}"><option value="">Choose…</option>${[...sug,...ALL.filter(x=>!sug.includes(x))].map(x=>`<option value="${esc(x)}">${esc(x)} · ${esc(trunc(byId[x].name,30))}</option>`).join("")}</select></td>
     <td style="white-space:nowrap"><button class="btn" data-orph="${esc(id)}" data-a="move">Move</button> <button class="btn danger" data-orph="${esc(id)}" data-a="del">Delete</button></td></tr>`}).join("")}</tbody></table></div>`}
function lateHTML(){const items=[...D.stages.map(s=>[`Stage ${s.n} · ${s.name}`,lateStage(s)]),...D.projects.map(p=>[`${p.id} · ${p.name}`,lateProject(p)]),...D.certs.map(k=>[k.name,lateCert(k)])].filter(x=>x[1]);
  if(!items.length)return "";
  return `<div class="card" style="margin-top:12px;border-color:#5a2a2a"><h3 style="margin:0 0 4px;font-size:14px">Past their window (${items.length})</h3><p class="mini" style="margin:0 0 8px">${esc(LATE_HINT)} Decide per item: cut it, move the window, or drop it.</p>
   ${items.map(([n,l])=>`<div style="margin:4px 0">${esc(n)} ${lateBadge(l)} <span class="mini">${l.days} days ago</span></div>`).join("")}</div>`}
function radarSVG(){
  const L=D.lanes.filter(l=>D.comps.some(c=>c.lane===l.id)),n=L.length,R=120,cx=170,cy=150;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const val=(l,f)=>{const ids=D.comps.filter(c=>c.lane===l.id).map(c=>c.id);return ids.filter(f).length/ids.length};
  const poly=f=>L.map((l,i)=>pt(i,Math.max(0.02,val(l,f))*R).join(",")).join(" ");
  let g="";[0.25,0.5,0.75,1].forEach(k=>{g+=`<polygon points="${L.map((_,i)=>pt(i,R*k).join(",")).join(" ")}" fill="none" stroke="#2a313c"/>`});
  L.forEach((l,i)=>{const [x,y]=pt(i,R),[tx,ty]=pt(i,R+18);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#2a313c"/><text x="${tx}" y="${ty+4}" fill="#8b949e" font-size="11" text-anchor="${Math.abs(tx-cx)<10?"middle":tx>cx?"start":"end"}">${esc(l.name)} ${Math.round(100*val(l,id=>st(id)==="done"))}%</text>`});
  g+=`<polygon points="${poly(id=>st(id)!=="ns")}" fill="none" stroke="var(--ip)" stroke-dasharray="4 3"/>`;
  g+=`<polygon points="${poly(id=>st(id)==="done")}" fill="var(--done)" fill-opacity=".25" stroke="var(--done)" stroke-width="1.5"/>`;
  return `<svg viewBox="-130 0 600 300" style="width:100%;max-width:560px;display:block;margin:auto" role="img" aria-label="Skills radar by domain">${g}</svg>`;
}
/* ---------- notices: first run, data changes, backup reminder ---------- */
let backupSnoozed=false, changeDetails=false;
function renderNotices(){
  const n=document.getElementById("notice");const parts=[];
  if(LOADINFO.fresh&&!S.firstRunDismissed&&!Object.keys(S.progress).length)
    parts.push(`<div class="notice" data-n="first"><b>No saved progress in this browser.</b> The local file and the website keep separate progress. If you've used the other one, export there and import here. <button class="btn" data-act="import">Import progress</button> <button class="btn" data-act="fresh">Start fresh</button></div>`);
  const dc=LOADINFO.dataChange;
  if(dc){const ren=dc.renamed.map(([id,r])=>`${esc(id)} → ${r.to?esc(r.to):r.split?("split into "+esc(r.split.join(", "))):"removed"}`);
    parts.push(`<div class="notice" data-n="change"><b>The roadmap changed since your last visit</b>${dc.from?` (data ${esc(dc.from)} → ${esc(D.version)})`:""}: ${dc.added.length} added · ${dc.removed.length} removed · ${dc.renamed.length} renamed or split. Your progress was carried over${Object.keys(S.orphans).length?`; ${Object.keys(S.orphans).length} entries need a home (Dashboard → Orphaned progress)`:""}.
      <button class="btn" data-act="details">${changeDetails?"Hide":"Details"}</button> <button class="btn" data-act="seen">Got it</button>
      ${changeDetails?`<div class="mini" style="margin-top:6px">${dc.added.length?`<div>Added: ${dc.added.map(esc).join(", ")}</div>`:""}${dc.removed.length?`<div>Removed: ${dc.removed.map(esc).join(", ")}</div>`:""}${ren.length?`<div>Renamed or split: ${ren.join(" · ")}</div>`:""}</div>`:""}</div>`)}
  if(!backupSnoozed&&needsBackup()){const days=Math.floor((Date.now()-Date.parse(S.lastExportAt||S.createdAt))/DAY);
    parts.push(`<div class="notice" data-n="backup"><b>Back up your progress.</b> ${S.lastExportAt?`Last export ${days} days ago`:"Never exported"}, and there are changes since. Progress lives only in this browser. <button class="btn" data-act="export">Export now</button> <button class="btn" data-act="later">Later</button></div>`)}
  n.innerHTML=parts.join("");
}
document.getElementById("notice").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="import")pickImport();
  if(a==="fresh"){S.firstRunDismissed=true;save()}
  if(a==="details")changeDetails=!changeDetails;
  if(a==="seen"){S.seen={dataVersion:D.version,ids:ALL.slice()};LOADINFO.dataChange=null;save()}
  if(a==="export")exportNow("");
  if(a==="later")backupSnoozed=true;
  renderNotices()});

/* ---------- import with preview ---------- */
const dlg=document.getElementById("dlg");
const OWN_BY_RECORDS=["level","levelNote","u","e","d","lastVerified"];
const FIELD_LABEL={level:"Level",levelNote:"Records note",u:"Understanding",e:"Execution",d:"Diagnosis",lastVerified:"Last verified"};
function pickImport(){const i=document.createElement("input");i.type="file";i.accept="application/json,.json";i.id="imp-picker";i.style.display="none";
  i.onchange=()=>{const f=i.files[0];i.remove();if(f)readImport(f)};document.body.appendChild(i);i.click()}
function readImport(f){f.text().then(t=>{let parsed=null;try{parsed=parseAny(JSON.parse(t))}catch(_){parsed=null}
  if(!parsed){showDialog(`<h2>Can't import this file</h2><p>It isn't a progress export or a records seed from this app. Nothing was changed.</p><div class="dlgact"><button class="btn" data-dlg="close">Close</button></div>`);return}
  previewImport(parsed,f.name)})}
function entrySummary(e){if(!e)return "—";const b=[];if(e.status)b.push(ST_LABEL[e.status]);if(e.level)b.push(e.level);if(e.link)b.push("link");if(e.notes)b.push("notes");if(e.evidence)b.push("evidence notes");return b.join(", ")||"—"}
function seedPlan(parsed){const changes=[],skipped=[];
  for(const [id,v] of Object.entries(parsed.progress)){const r=resolveId(id);if(!r.to){skipped.push(id);continue}
    const cur=P(r.to),diff=OWN_BY_RECORDS.filter(k=>(cur[k]||"")!==(v[k]||""));if(diff.length)changes.push({id:r.to,from:cur,to:v,diff})}
  return {changes,skipped}}
function previewImport(parsed,name){
  if(parsed.kind==="seed"){const {changes,skipped}=seedPlan(parsed);
    const fmt=(e,k)=>esc(k==="u"||k==="e"||k==="d"?(e[k]?MARKS[e[k]]:"—"):(e[k]||"—"));
    showDialog(`<h2>Import records seed</h2><p class="mini">${esc(name)}${parsed.meta.snapshotDate?` · records snapshot ${esc(parsed.meta.snapshotDate)}`:""}</p>
     <p>The records own <b>level, U/E/D and last verified</b>; your statuses, notes and links stay as they are. The seed never marks anything Completed.</p>
     <p><b>${changes.length}</b> competencies change · ${Object.keys(parsed.progress).length-skipped.length} in the seed match · ${skipped.length} not in this roadmap (skipped${skipped.length?": "+esc(skipped.slice(0,12).join(", "))+(skipped.length>12?"…":""):""})</p>
     ${changes.length?`<div class="dlgscroll"><table><thead><tr><th>ID</th><th>Field</th><th>Now</th><th>From records</th></tr></thead><tbody>${changes.flatMap(c=>c.diff.map((k,i)=>`<tr><td>${i?"":esc(c.id)}</td><td>${esc(FIELD_LABEL[k]||k)}</td><td>${fmt(c.from,k)}</td><td>${fmt(c.to,k)}</td></tr>`)).join("")}</tbody></table></div>`:""}
     <p class="mini">A backup of your current progress is downloaded first.</p>
     <div class="dlgact"><button class="btn" data-dlg="close">Cancel</button>${changes.length?`<button class="btn on" data-dlg="seed">Apply ${changes.length} changes</button>`:""}</div>`,
     {seed:()=>{backupNow("seed");for(const c of changes){const e=entry(c.id);for(const k of OWN_BY_RECORDS){if(has(c.to,k))e[k]=c.to[k];else delete e[k]}}touch();refreshAll()}});
    return}
  const n=normalize(parsed.progress,parsed.orphans);const ids=Object.keys(n.progress);
  const conflicts=ids.filter(id=>S.progress[id]&&JSON.stringify(S.progress[id])!==JSON.stringify(n.progress[id]));
  const fresh=ids.filter(id=>!S.progress[id]);const orph=Object.keys(n.orphans);
  showDialog(`<h2>Import progress</h2><p class="mini">${esc(name)} · ${parsed.kind==="v1"?"older format (converted)":"current format"}</p>
   <p><b>${ids.length}</b> competencies with progress in the file · ${fresh.length} new here · ${conflicts.length} differ from what this browser has · ${n.renamed.length} under an old ID (carried over) · ${orph.length} orphaned (kept, shown on the dashboard)</p>
   ${conflicts.length?`<div class="dlgscroll"><table><thead><tr><th>ID</th><th>In this browser</th><th>In the file</th></tr></thead><tbody>${conflicts.map(id=>`<tr><td>${esc(id)}</td><td>${esc(entrySummary(S.progress[id]))}</td><td>${esc(entrySummary(n.progress[id]))}</td></tr>`).join("")}</tbody></table></div>`:""}
   <p><b>Merge</b> keeps both: for each competency the newer change wins and differing notes are kept together. <b>Replace</b> makes this browser match the file exactly.</p>
   <p class="mini">A backup of your current progress is downloaded first.</p>
   <div class="dlgact"><button class="btn" data-dlg="close">Cancel</button><button class="btn danger" data-dlg="replace">Replace</button><button class="btn on" data-dlg="merge">Merge</button></div>`,
   {merge:()=>{backupNow("import");for(const id of ids)S.progress[id]=mergeEntry(S.progress[id],n.progress[id]);for(const id of orph)S.orphans[id]=Object.assign(mergeEntry(S.orphans[id],n.orphans[id]),{reason:n.orphans[id].reason,splitInto:n.orphans[id].splitInto});finishImport(parsed)},
    replace:()=>{backupNow("import");S.progress=n.progress;S.orphans=n.orphans;finishImport(parsed)}});
}
function finishImport(parsed){for(const id of Object.keys(S.orphans))if(!S.orphans[id].splitInto)delete S.orphans[id].splitInto;
  S.firstRunDismissed=true;if(parsed.meta&&parsed.meta.lastExportAt&&!S.lastExportAt)S.lastExportAt=parsed.meta.lastExportAt;touch();refreshAll()}
function showDialog(html,actions){dlg.innerHTML=html;dlg.onclick=e=>{const b=e.target.closest("[data-dlg]");if(!b)return;const a=b.dataset.dlg;dlg.close();if(a!=="close"&&actions&&actions[a])actions[a]()};
  if(dlg.showModal){if(!dlg.open)dlg.showModal()}else dlg.setAttribute("open","")}

/* ---------- lateness (D-10): a window passed with the work not done ---------- */
const today = () => (typeof window.ROADMAP_TODAY==="string"&&!isNaN(Date.parse(window.ROADMAP_TODAY)))?Date.parse(window.ROADMAP_TODAY):Date.now();
const endOfDay = d => Date.parse(d+"T23:59:59");
const monthEnd = ym => {const [y,m]=ym.split("-").map(Number);return new Date(y,m,0,23,59,59).getTime()};
const fmtDate = t => new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
function lateness(dueMs,comps){if(dueMs==null||!comps.length||today()<=dueMs||pct(comps)===100)return null;return {due:dueMs,days:Math.floor((today()-dueMs)/DAY)}}
const lateStage = s => lateness(s.due?endOfDay(s.due):null,compsIn(s.id));
const lateProject = p => lateness(p.due?endOfDay(p.due):null,p.comps);
const lateCert = k => lateness(k.end?monthEnd(k.end):null,k.comps);
const LATE_HINT = "Cut scope or re-plan. Missed time doesn't roll over (doc 18).";
const lateBadge = l => l?`<span class="badge late" title="${esc(LATE_HINT)}">Late: window ended ${esc(fmtDate(l.due))}</span>`:"";

/* ---------- timetable (D-10): committed only as AES-GCM ciphertext; unlocked in the browser ---------- */
const TT_ITER=600000, TT_MIN_PW=14;
let TT=null, ttError="", ttBlobOut=null;
const te=new TextEncoder(), td=new TextDecoder();
function b64(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const unb64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const cryptoOK = () => !!(window.crypto&&crypto.subtle);
async function ttKey(pw,salt,iter){const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function ttEncrypt(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await ttKey(pw,salt,TT_ITER),te.encode(JSON.stringify(obj))));
  return {v:1,kdf:"PBKDF2-SHA256",iter:TT_ITER,cipher:"AES-256-GCM",salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function ttDecrypt(blob,pw){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(blob.iv)},await ttKey(pw,unb64(blob.salt),blob.iter),unb64(blob.ct));
  return cleanTimetable(JSON.parse(td.decode(pt)))}
function cleanTimetable(o){if(!isObj(o)||!Array.isArray(o.rows))throw new Error("shape");
  return {updated:str(o.updated,20)||"",notes:str(o.notes,4000)||"",rows:o.rows.slice(0,200).filter(isObj).map(r=>({when:str(r.when,200)||"",what:str(r.what,1000)||""})).filter(r=>r.when||r.what)}}
const rowsToText = rows => rows.map(r=>`${r.when} | ${r.what}`).join("\n");
const textToRows = t => t.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf("|");return i<0?{when:l,what:""}:{when:l.slice(0,i).trim(),what:l.slice(i+1).trim()}});
function renderTimetable(){
  const v=document.getElementById("v-time"),blob=D.timetable;
  const lock=!TT?(blob?`<form class="card" id="ttunlock" style="max-width:520px"><label class="mini" for="ttpw">Password</label>
      <div style="display:flex;gap:8px;margin-top:4px"><input class="btn" id="ttpw" type="password" autocomplete="current-password" style="flex:1"><button class="btn on" type="submit">Unlock</button></div>
      ${ttError?`<p class="mini" role="alert" style="color:#ffb3ae;margin:8px 0 0">${esc(ttError)}</p>`:""}
      <p class="mini" style="margin:8px 0 0">Decrypted in this tab only; nothing is sent or stored.</p></form>`
    :`<div class="card" style="max-width:640px"><p style="margin:0">No timetable is published yet. Create one below, save the file as <code>data/timetable.enc.json</code>, rebuild and commit.</p></div>`)
    :`<div class="card"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><h3 style="margin:0;font-size:14px">Weekly timetable</h3>${TT.updated?`<span class="mini">updated ${esc(TT.updated)}</span>`:""}<button class="btn" id="ttlock" style="margin-left:auto">Lock</button></div>
      <table style="margin-top:8px"><thead><tr><th style="width:38%">When</th><th>What</th></tr></thead><tbody>${TT.rows.map(r=>`<tr class="cl"><td><b>${esc(r.when)}</b></td><td>${esc(r.what)}</td></tr>`).join("")}</tbody></table>
      ${TT.notes?`<p class="mini" style="margin:10px 0 0;white-space:pre-wrap">${esc(TT.notes)}</p>`:""}</div>`;
  v.innerHTML=`<div class="page"><h2>Timetable</h2><p class="lead">Your week, and whether you're behind. The timetable is published only as encrypted data (AES-256-GCM, key from your password with PBKDF2, ${TT_ITER.toLocaleString()} rounds). Anyone can download the ciphertext, so a weak password can be guessed offline; use a long one.</p>
   ${cryptoOK()?lock:`<div class="warn">This browser doesn't allow Web Crypto on this page (it needs https or a local file). Open the published site to unlock the timetable.</div>`}
   ${lateHTML()||`<div class="card" style="margin-top:12px"><p class="mini" style="margin:0">Nothing is past its window. Lateness counts stages, projects and certs whose window ended with work not done; missed sessions never roll over.</p></div>`}
   ${cryptoOK()?`<details class="card" style="margin-top:12px" ${ttBlobOut?"open":""}><summary style="cursor:pointer"><b>Create or replace the encrypted timetable</b></summary>
    <p class="mini">One row per line: <code>when | what</code>. ${TT?"Prefilled from the unlocked timetable.":""}</p>
    <textarea id="ttrows" rows="8" placeholder="Mon 19:00–20:00 | Example: one course item&#10;Sat 10:00–12:00 | Example: project work">${TT?esc(rowsToText(TT.rows)):""}</textarea>
    <label class="mini" for="ttnotes">Notes (optional)</label><textarea id="ttnotes" rows="2">${TT?esc(TT.notes):""}</textarea>
    <div class="evgrid" style="margin-top:8px"><label>New password<input id="ttnew" type="password" autocomplete="new-password"></label><label>Repeat it<input id="ttnew2" type="password" autocomplete="new-password"></label></div>
    <p class="mini" id="ttstrength" style="margin:6px 0"></p>
    <button class="btn on" id="ttenc">Encrypt</button>
    ${ttBlobOut?`<div style="margin-top:10px"><p class="mini" style="margin:0 0 4px">Encrypted. Save it as <code>data/timetable.enc.json</code>, run <code>python3 tools/build.py</code>, then commit. The password is not in the file; don't lose it.</p>
      <textarea id="ttout" rows="4" readonly>${esc(JSON.stringify(ttBlobOut))}</textarea><button class="btn" id="ttdl">Download timetable.enc.json</button></div>`:""}
   </details>`:""}</div>`;
  const f=v.querySelector("#ttunlock");
  if(f)f.onsubmit=async e=>{e.preventDefault();const pw=v.querySelector("#ttpw").value;ttError="";
    try{TT=await ttDecrypt(blob,pw)}catch(_){TT=null;ttError="That password doesn't open this timetable."}renderTimetable();if(!TT)v.querySelector("#ttpw").focus()};
  const lk=v.querySelector("#ttlock");if(lk)lk.onclick=()=>{TT=null;ttBlobOut=null;renderTimetable()};
  const nw=v.querySelector("#ttnew"),strength=v.querySelector("#ttstrength");
  const judge=()=>{if(!nw)return;const n=nw.value.length;strength.textContent=!n?`Use at least ${TT_MIN_PW} characters; a few random words work well.`:n<TT_MIN_PW?`⚠ ${n} characters: short passwords can be guessed offline. ${TT_MIN_PW}+ recommended.`:`${n} characters.`;strength.style.color=n&&n<TT_MIN_PW?"#e8d28a":""};
  if(nw){nw.oninput=judge;judge();
    v.querySelector("#ttenc").onclick=async()=>{const p1=nw.value,p2=v.querySelector("#ttnew2").value;
      if(!p1){strength.textContent="Enter a password.";return}if(p1!==p2){strength.textContent="The two passwords don't match.";strength.style.color="#ffb3ae";return}
      const rows=textToRows(v.querySelector("#ttrows").value);if(!rows.length){strength.textContent="Add at least one row.";return}
      ttBlobOut=await ttEncrypt({kind:"timetable",v:1,updated:new Date().toISOString().slice(0,10),rows,notes:v.querySelector("#ttnotes").value},p1);renderTimetable()};}
  const dl=v.querySelector("#ttdl");if(dl)dl.onclick=()=>download(ttBlobOut,"timetable.enc.json");
}

/* ---------- keyboard: Escape closes the panel; "/" focuses search ---------- */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&panel.classList.contains("on")&&!dlg.open){e.preventDefault();closePanel()}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(e.key==="/"&&!typing&&GRAPHS[curView]){const s=document.querySelector(`#v-${curView} .gsearch`);if(s){e.preventDefault();s.focus()}}});
/* ---------- deep links: #NET-3 opens that competency; #PY-1–7 opens the group ---------- */
function fromHash(){let id="";try{id=decodeURIComponent(location.hash.slice(1))}catch(_){return}if(!id)return;
  if(byId[id]){if(!GRAPHS[curView])showView("flow");select(id,{center:true,focus:false})}else if(groupById[id]){if(!GRAPHS[curView])showView("flow");openGroup(id,{center:true})}}
window.addEventListener("hashchange",fromHash);
/* ---------- header + refresh ---------- */
function renderHeader(){document.getElementById("ver").textContent="v"+D.version;document.getElementById("hpct").textContent=`${pct(ALL)}% · ${ALL.filter(i=>st(i)==="done").length}/${ALL.length}`;document.getElementById("hbar").outerHTML=barHTML(ALL,160).replace('class="bar"','class="bar" id="hbar"')}
function refreshAll(){renderNotices();renderHeader();renderGraphState();if(!GRAPHS[curView])renderView(curView);if(selId&&panel.classList.contains("on"))openComp(selId)}
renderGraphState();renderHeader();renderNotices();
requestAnimationFrame(()=>{GRAPHS.flow.fit();fromHash()});
</script>
